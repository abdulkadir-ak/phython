/* ---------------- rig: tube geometry ----------------
 * One skinned tube rebuilt every frame from the spine chain.
 * Rings follow the spine points; radial vertices face outward.
 * v UV: 0.5 = back centre, 0/1 seam hidden against the ground.     */
function buildTubeGeometry(T) {
  var per = RADIAL + 1;
  var count = N * per;
  var pos = new Float32Array(count * 3);
  var nor = new Float32Array(count * 3);
  /* v4.1: per-vertex contact shading (fake ambient occlusion where the body
   * lies over itself); filled every frame in _updateBody */
  var col = new Float32Array(count * 3);
  var uv = new Float32Array(count * 2);
  var idx = new (count > 65535 ? Uint32Array : Uint16Array)((N - 1) * RADIAL * 6);
  var i, j, o, a, b, k = 0;
  for (i = 0; i < N; i++) {
    for (j = 0; j <= RADIAL; j++) {
      o = (i * per + j) * 2;
      uv[o] = i / (N - 1);
      uv[o + 1] = (j / RADIAL + 0.5) % 1;
    }
    o = (i * per) * 3;
    nor[o + 1] = 1;             /* placeholder, filled analytically per frame */
    for (j = 1; j <= RADIAL; j++) nor[o + j * 3 + 1] = 1;
  }
  for (i = 0; i < N - 1; i++) {
    for (j = 0; j < RADIAL; j++) {
      a = i * per + j;
      b = a + per;
      idx[k++] = a; idx[k++] = a + 1; idx[k++] = b;
      idx[k++] = a + 1; idx[k++] = b + 1; idx[k++] = b;
    }
  }
  var g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3).setUsage(T.DynamicDrawUsage));
  g.setAttribute('normal', new T.BufferAttribute(nor, 3).setUsage(T.DynamicDrawUsage));
  g.setAttribute('color', new T.BufferAttribute(col, 3).setUsage(T.DynamicDrawUsage));
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  g.setIndex(new T.BufferAttribute(idx, 1));
  return g;
}

/* ---------------- lofted skull ----------------
 * The head is ONE continuous surface, built like the body tube: a stack of
 * cross-sections from the snout tip to the occiput. Width rises from the
 * blunt rostrum to the jaw corners and eases back into the neck; the rear
 * stations reuse the body-ring formulas (same belly flatten and centre
 * offset) so the head melts into the first neck rings with no seam. */
var HEAD_ST = [
  /* [z, halfWidth, vFlat, lift]  z: -0.24 (in the neck) -> 0.62 snout tip.
   * vFlat slimms the section vertically (the skull is flatter than the
   * neck ring it joins); lift raises the chin off the ground forward. */
  [-0.24, 0.252, 0.890, 0.000],
  [-0.16, 0.255, 0.870, 0.001],
  [-0.08, 0.262, 0.830, 0.003],
  [ 0.00, 0.268, 0.810, 0.006],
  [ 0.06, 0.271, 0.800, 0.008],
  [ 0.12, 0.272, 0.790, 0.010],
  [ 0.18, 0.262, 0.790, 0.012],
  [ 0.24, 0.244, 0.790, 0.015],
  [ 0.29, 0.226, 0.795, 0.018],
  [ 0.34, 0.208, 0.805, 0.020],
  [ 0.39, 0.186, 0.812, 0.023],
  [ 0.44, 0.164, 0.820, 0.026],
  [ 0.48, 0.140, 0.820, 0.028],
  [ 0.52, 0.118, 0.820, 0.030],
  [ 0.58, 0.078, 0.830, 0.032],
  [ 0.62, 0.040, 0.840, 0.033]
];
function buildHeadGeometry(T) {
  var RH = 20, ST = HEAD_ST.length, per = RH + 1;
  var pos = new Float32Array(ST * per * 3);
  var nor = new Float32Array(ST * per * 3);
  var uv = new Float32Array(ST * per * 2);
  var idx = new Uint16Array((ST - 1) * RH * 6);
  var HV = 0.94;
  var i, j, o, a, b, k = 0;
  for (i = 0; i < ST; i++) {
    var z = HEAD_ST[i][0], r = HEAD_ST[i][1], vF = HEAD_ST[i][2], lift = HEAD_ST[i][3];
    var cy = r * 0.677 + lift;          /* same ring-centre offset as the body */
    var ia = i > 0 ? i - 1 : 0, ib = i < ST - 1 ? i + 1 : ST - 1;
    var rs = (HEAD_ST[ib][1] - HEAD_ST[ia][1]) / ((HEAD_ST[ib][0] - HEAD_ST[ia][0]) || 1);
    for (j = 0; j <= RH; j++) {
      o = (i * per + j) * 2;
      uv[o] = 1 - i / (ST - 1);         /* u 0 = snout tip, u 1 = occiput   */
      uv[o + 1] = (j / RH + 0.5) % 1;   /* v 0.5 dorsal midline, 0/1 gape   */
      var th = j / RH * TAU;
      var up = Math.cos(th), sn = Math.sin(th);
      var vf, vf2;
      if (up < 0) {
        /* belly: body flatten, eased back to the exact body shape below */
        vf = (HV - (1 - HV) * (-up) * 2.2) * (1 + (vF - 1) * (1 + up));
        vf2 = 1 + (1 - vf) * 0.55;
      } else {
        vf = HV * vF;
        vf2 = 1;
      }
      var cs = up * r * 0.80 * vf;
      var sn2 = sn * r * vf2;
      o = (i * per + j) * 3;
      pos[o] = sn2;
      pos[o + 1] = cy + cs;
      pos[o + 2] = z;
      /* analytic normal: radial direction tilted against the width slope */
      var nX = sn2, nY = cs, nZ = -rs * 0.9;
      var nL = 1 / (Math.sqrt(nX * nX + nY * nY + nZ * nZ) || 1);
      nor[o] = nX * nL; nor[o + 1] = nY * nL; nor[o + 2] = nZ * nL;
    }
  }
  for (i = 0; i < ST - 1; i++) {
    for (j = 0; j < RH; j++) {
      a = i * per + j;
      b = a + per;
      idx[k++] = a; idx[k++] = a + 1; idx[k++] = b;
      idx[k++] = a + 1; idx[k++] = b + 1; idx[k++] = b;
    }
  }
  var g = new T.BufferGeometry();
  g.setAttribute('position', new T.BufferAttribute(pos, 3));
  g.setAttribute('normal', new T.BufferAttribute(nor, 3));
  g.setAttribute('uv', new T.BufferAttribute(uv, 2));
  g.setIndex(new T.BufferAttribute(idx, 1));
  return g;
}

/* ---------------- one anaconda ---------------- */
function AnacondaRig(mgr, spawn) {
  var T = mgr._T, i;
  this._mgr = mgr;
  this._T = T;

  /* spine state: body trails behind the spawn heading */
  this._P = [];
  var acc = 0, fx = Math.sin(spawn.h), fz = Math.cos(spawn.h);
  for (i = 0; i < N; i++) {
    if (i > 0) acc += SEG;
    this._P.push({ x: spawn.x - fx * acc, z: spawn.z - fz * acc });
  }
  this._R = []; this._dirs = []; this._tang = []; this._right = []; this._upv = [];
  for (i = 0; i < N; i++) {
    this._R.push(new T.Vector3(0, 0.02, 0));
    this._dirs.push({ x: fx, z: fz });
    this._tang.push(new T.Vector3(fx, 0, fz));
    this._right.push(new T.Vector3(-fz, 0, fx));
    this._upv.push(new T.Vector3(0, 1, 0));
  }

  this._heading = spawn.h; this._headingT = spawn.h;
  this._speed = 0; this._vTarget = 0;
  this._phase = rnd(0, TAU);
  this._weavePh = rnd(0, TAU);      /* spatial phase of the serpentine weave */
  this._roll = 0; this._prevHeading = spawn.h;
  this._state = 'idle'; this._stateT = 0;
  this._idleDur = 1.0 + spawn.stagger;
  this._cruiseJit = 0;
  this._target = { x: spawn.x, z: spawn.z + 2 };
  this._idleYaw = 0; this._idleYawT = 0; this._nextLook = 0.4;
  this._tongueT = 0; this._tongueNext = rnd(0.7, 2.2); this._tongueDur = 1.1;
  this._tongueSeed = Math.random() * 10; this._tongueRe = 0; this._jawOpen = 0;
  this._scareCd = 0;
  this._alert = 0;
  this._alertPoint = { x: spawn.x, z: spawn.z };
  this._afterFreeze = 'auto';
  this._agitate = 0;               /* fast tail-flick energy after a scare */
  this._pant = 0;                  /* heavy breathing after a speed burst  */
  this._curious = 0;               /* watching a slow cursor from afar     */
  this._arousal = 0.2;             /* v4.0 continuous calm <-> alert drive */
  this._yawnT = 0; this._yawnOpen = 0;
  this._yawnDur = 1.8; this._yawnNext = rnd(16, 34);

  /* v3.0 movement physics state */
  this._turnVel = 0;               /* smoothed angular velocity (rad/s)      */
  this._gait = 'rest';             /* rest/crawl/cruise/fast/escape/turn     */
  this._seed = Math.random() * 100;/* per-animal drift for organic variation */
  this._waveD = 0;                 /* locomotion wave phase, distance-coupled*/
  this._idleAmt = 1;               /* smooth 0..1 rest-vs-locomotion blend   */
  this._weaveAmp = 0.46;           /* S-weave amplitude (gait + drift driven)*/
  this._waveSm = new Float32Array(N); /* per-ring smoothed lateral offset    */
  this._rlxX = new Float32Array(N);   /* self-collision relax accumulators   */
  this._rlxZ = new Float32Array(N);
  this._roX = new Float32Array(N);    /* applied relax offset per ring (low- */
  this._roZ = new Float32Array(N);    /* passed: pushes ramp, never jerk)    */
  this._roTX = new Float32Array(N);   /* v4.2: spine-blurred relax push      */
  this._roTZ = new Float32Array(N);   /* targets (no ring-to-ring zigzag)    */
  /* v4.1: strongest body contact per ring, for flesh squash + crease
   * shading where the body lies over itself (see _relaxBody/_updateBody) */
  this._ctA = new Float32Array(N);    /* contact strength 0..1               */
  this._ctNX = new Float32Array(N);   /* unit direction toward the contact   */
  this._ctNY = new Float32Array(N);
  this._ctNZ = new Float32Array(N);
  /* v4.1: visual ring centers - a lightly smoothed copy of the physics
   * chain. Pairwise relaxation settles into a small period-2 in/out ring
   * pattern inside a tight coil; smoothing removes that zigzag from the
   * SKIN only - movement and collision physics stay untouched. */
  this._Rv = new Float32Array(N * 3);
  /* v4.2: continuous overlap fields. Raw per-frame contact data pops at
   * the tangency threshold and flips when the deepest partner changes,
   * which reads as a flickering crease; _ctASm/_ctN*s hold a temporally
   * smoothed copy (exponential in SECONDS, identical at any fps) and
   * _ctA2/_ctN*2 a spine-blurred copy that the cross-section consumes -
   * the 3-tap blur makes it impossible for the squash or the crease
   * shadow to step between neighbouring rings. */
  this._ctASm = new Float32Array(N);
  this._ctNXs = new Float32Array(N);
  this._ctNYs = new Float32Array(N);
  this._ctNZs = new Float32Array(N);
  this._ctA2 = new Float32Array(N);
  this._ctNX2 = new Float32Array(N);
  this._ctNY2 = new Float32Array(N);
  this._ctNZ2 = new Float32Array(N);
  this._ctW = new Float32Array(N);
  /* v4.2.2: ground-press field (same shape as the overlap field above):
   * _gPr raw per-ring press, _gSm temporal-smoothed, _gA2 spine-blurred
   * depth the belly flatten deepens by where the body bears down */
  this._gPr = new Float32Array(N);
  this._gSm = new Float32Array(N);
  this._gA2 = new Float32Array(N);
  /* v4.3: randomized 3D over/under crossing of the head across its own
   * body. _crMode: 0 = no engagement, 1 = head passes OVER, 2 = head
   * passes UNDER (the crossed section arches). One coin flip starts an
   * engagement; the decision stays locked until the head has fully
   * cleared (hysteresis), so a crossing never oscillates. The two
   * vertical-separation fields follow the SAME continuity pipeline as
   * the overlap and ground-press fields: per-pair geometric need ->
   * exponential smoothing in seconds (fast rise, gradual settle) ->
   * 5-tap binomial blur along the spine -> apply. With no engagement
   * every field stays exactly zero and the rig behaves exactly like
   * v4.2.2. */
  this._crMode = 0;
  this._crEvents = 0;         /* decisions taken so far (tests/diagn.)   */
  this._crLastMode = 0;
  this._crClear = 0;          /* seconds the crossing path stayed clear  */
  this._crRing = new Float32Array(N);  /* per-ring engagement 0..1       */
  this._crIraw = new Float32Array(N);  /* OVER lift: raw per-frame       */
  this._crIsm  = new Float32Array(N);  /* OVER lift: temporal-smoothed   */
  this._crI    = new Float32Array(N);  /* OVER lift: blurred + applied   */
  this._crJraw = new Float32Array(N);  /* UNDER arch: raw per-frame      */
  this._crJsm  = new Float32Array(N);  /* UNDER arch: temporal-smoothed  */
  this._crJ    = new Float32Array(N);  /* UNDER arch: blurred + applied  */
  this._crPB = new Float32Array(1024 * 5);  /* captured-pair buffer      */
  this._crPN = 0;
  this._crPrevD = Infinity;   /* last frame's nearest captured distance  */
  this._crPraw = new Float32Array(N);  /* pair closeness: raw / smoothed  */
  this._crPsm  = new Float32Array(N);  /* (eases avoid + relax during a   */
                                       /*  committed approach, so the     */
                                       /*  crossing can actually complete)*/
  this._avoidSlow = 0;             /* cramped-space speed damping 0..1       */
  this._gp = {                     /* blended gait parameters                */
    waveK: GAITS.rest.waveK, waveA: GAITS.rest.waveA, neck: GAITS.rest.neck,
    tailG: GAITS.rest.tailG, stride: GAITS.rest.stride, weave: GAITS.rest.weave,
    push: GAITS.rest.push, accel: GAITS.rest.accel
  };

  this._vA = new T.Vector3(); this._vB = new T.Vector3();

  /* body tube (geometry registered with the manager for dispose()) */
  this._geo = mgr._geo(buildTubeGeometry(T));
  this._tube = new T.Mesh(this._geo, mgr._matSkin);
  this._tube.frustumCulled = false;
  mgr._root.add(this._tube);

  /* tail tip */
  this._tip = new T.Mesh(mgr._tipGeo, mgr._matSkin);
  mgr._root.add(this._tip);

  this._buildHead(mgr);
  this._buildShadows(mgr);
}

AnacondaRig.prototype._buildHead = function (mgr) {
  var T = this._T, m, side;
  var g = new T.Group();

  /* skull: one lofted surface from snout tip to occiput; the rear stations
   * match the neck ring cross-section, so there is no visible junction */
  m = new T.Mesh(mgr._geo(buildHeadGeometry(T)), mgr._matHead);
  g.add(m);
  this._skullMesh = m;

  /* cheek / quadrate bulges at the jaw corners - the widest point of the
   * real skull, just ahead of the neck (kept subtle: deep-set, low) */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.052, 12, 9)), mgr._matHeadDark);
    m.scale.set(0.52, 0.70, 1.25);
    m.position.set(side * 0.228, 0.115, 0.04);
    g.add(m);
  }

  /* canthus rostralis: the raised ridge along each top edge of the snout */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.024, 10, 8)), mgr._matHeadDark);
    m.scale.set(0.50, 0.50, 3.2);
    m.position.set(side * 0.075, 0.195, 0.40);
    g.add(m);
  }

  /* rostral scale: the blunt cap on the very tip of the snout */
  m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.048, 12, 9)), mgr._matHeadDark);
  m.scale.set(1.05, 0.62, 0.75);
  m.position.set(0, 0.075, 0.565);
  g.add(m);

  /* hinged lower jaw: two slim mandible halves on a quadrate pivot behind
   * the jaw corners, with the flexible chin gap real snakes show */
  var jp = new T.Group();
  jp.position.set(0, 0.058, -0.055);
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.095, 12, 9)), mgr._matJaw);
    m.scale.set(0.58, 0.40, 2.75);
    m.position.set(side * 0.072, -0.028, 0.20);
    m.rotation.y = side * 0.10;
    jp.add(m);
    if (side < 0) this._mandibleL = m; else this._mandibleR = m;
  }
  /* chin knob where the halves meet */
  m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.026, 8, 6)), mgr._matJaw);
  m.position.set(0, -0.045, 0.435);
  jp.add(m);
  /* dark mouth interior: shows through the gape when the jaw drops */
  m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.088, 10, 8)), mgr._matPupil);
  m.scale.set(1.05, 0.60, 1.65);
  m.position.set(0, 0.012, 0.16);
  jp.add(m);
  g.add(jp);
  this._jawPivot = jp;

  /* dark eye sockets just behind / below each eye - kept small and buried
   * in the crown flank (a proud glossy sphere reads as a blob from above) */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.030, 10, 8)), mgr._matHeadDark);
    m.scale.set(0.85, 0.42, 1.0);
    m.position.set(side * 0.196, 0.198, 0.185);
    g.add(m);
  }

  /* big blazing orange eyes set HIGH and dorso-lateral on the skull rim,
   * flush in their sockets like the reference face */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.048, 14, 12)), mgr._matEye);
    m.scale.set(0.92, 0.88, 1.0);
    m.position.set(side * 0.176, 0.252, 0.24);
    g.add(m);
    /* green anacondas have ROUND pupils (vertical slits are python/viper) */
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.026, 10, 8)), mgr._matPupil);
    m.position.set(side * 0.212, 0.254, 0.262);
    m.scale.set(0.85, 1.0, 0.9);
    g.add(m);
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.0035, 6, 6)), mgr._matGlint);
    m.position.set(side * 0.218, 0.266, 0.268);
    g.add(m);
    /* supraocular ridge: the bony scale shelf over the eye */
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.042, 10, 8)), mgr._matHeadDark);
    m.scale.set(0.70, 0.26, 1.45);
    m.position.set(side * 0.140, 0.298, 0.22);
    g.add(m);
  }

  /* dark postocular stripe: the near-black line every real anaconda carries
   * from the eye back toward the jaw corner - visible from above and from
   * the side, so it is built as geometry, not just texture */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.028, 10, 8)), mgr._matPupil);
    m.scale.set(0.50, 1.15, 2.3);
    m.position.set(side * 0.195, 0.20, 0.135);
    m.rotation.set(0.22, side * 0.10, 0);
    g.add(m);
  }

  /* nostrils on top of the snout tip */
  for (side = -1; side <= 1; side += 2) {
    m = new T.Mesh(mgr._geo(new T.SphereGeometry(0.009, 8, 6)), mgr._matPupil);
    m.position.set(side * 0.048, 0.178, 0.50);
    g.add(m);
  }

  /* forked black tongue: a jointed chain so it can wave and curl.
   * lives fully inside the mouth until a flick pushes it out. */
  var tg = new T.Group();
  tg.position.set(0, 0.075, 0.44);
  this._tongueBaseZ = 0.44;
  var LEN = [0.075, 0.083, 0.083, 0.075, 0.062, 0.052];
  var RADr = [0.0143, 0.0117, 0.0096, 0.0078, 0.0062, 0.0049];
  var parent = tg, segs = [];
  for (var si = 0; si < LEN.length; si++) {
    var sg = new T.Group();
    if (si > 0) sg.position.z = LEN[si - 1];
    var cyl = new T.Mesh(mgr._geo(new T.CylinderGeometry(RADr[si] * 0.86, RADr[si], LEN[si], 5)), mgr._matTongue);
    cyl.geometry.translate(0, LEN[si] / 2, 0);
    cyl.rotation.x = Math.PI / 2;
    sg.add(cyl);
    parent.add(sg);
    segs.push(sg);
    parent = sg;
  }
  /* the two fork prongs, spread animates */
  var prongs = [];
  for (side = -1; side <= 1; side += 2) {
    var pr = new T.Group();
    pr.position.z = LEN[LEN.length - 1];
    pr.rotation.y = side * 0.22;
    var fk = new T.Mesh(mgr._geo(new T.CylinderGeometry(0.0016, 0.0044, 0.11, 4)), mgr._matTongue);
    fk.geometry.translate(0, 0.055, 0);
    fk.rotation.x = Math.PI / 2;
    pr.add(fk);
    parent.add(pr);
    prongs.push(pr);
  }
  tg.scale.z = 0.001;
  g.add(tg);
  this._tongueGrp = tg;
  this._tongueSegs = segs;
  this._tongueProngs = prongs;

  mgr._root.add(g);
  this._head = g;
};

AnacondaRig.prototype._buildShadows = function (mgr) {
  var T = this._T, i;
  /* one shared flat material; the geometry is baked flat on the ground
   * (rotateX in the manager) and each quad is yawed along the body tangent */
  this._shadows = [];
  for (i = 0; i < N; i += 4) {
    var s = new T.Mesh(mgr._shadowGeo, mgr._matShadow);
    s.renderOrder = 1;
    s.position.y = 0.006 + (i % 8) * 0.0008;
    mgr._root.add(s);
    this._shadows.push(s);
  }
};

/* ---------------- v3.0 gait library ----------------
 * One row per movement style. Parameters (all blending smoothly, so a
 * gait change never pops):
 *   waveK  spatial frequency of the locomotion wave (rad per ring)
 *   waveA  lateral amplitude of the locomotion wave (u)
 *   neck   rings over which the wave ramps in (the stiff neck leads,
 *          the wave grows behind it - like a real snake pushing)
 *   tailG  extra flexibility gain toward the tail tip (follow-through)
 *   stride S-weave wavelength in metres of path per full S
 *   weave  S-weave amplitude for the heading target (rad)
 *   push   stride-synced surge of forward speed (0..x, subtle)
 *   accel  how quickly speed approaches its target (per second)
 * The wave phase itself advances with DISTANCE travelled (not time), so
 * the wave is glued to the ground the animal crawls over, holds its pose
 * when the snake stops, and is identical at 30 or 60 fps. WAVE_SLIP > 1
 * makes the wave slip backward along the body slightly faster than the
 * body moves - the muscular look of real lateral undulation. */
var GAITS = {
  rest:   { waveK: 0.34, waveA: 0.026, neck: 7,  tailG: 1.15, stride: 2.8,  weave: 0.00, push: 0.00, accel: 1.9 },
  crawl:  { waveK: 0.46, waveA: 0.056, neck: 7,  tailG: 1.35, stride: 2.6,  weave: 0.46, push: 0.05, accel: 2.4 },
  cruise: { waveK: 0.42, waveA: 0.050, neck: 8,  tailG: 1.30, stride: 2.3,  weave: 0.50, push: 0.05, accel: 2.8 },
  fast:   { waveK: 0.36, waveA: 0.044, neck: 9,  tailG: 1.25, stride: 2.0,  weave: 0.38, push: 0.04, accel: 3.4 },
  escape: { waveK: 0.34, waveA: 0.058, neck: 10, tailG: 1.45, stride: 1.85, weave: 0.28, push: 0.07, accel: 5.0 },
  turn:   { waveK: 0.44, waveA: 0.034, neck: 6,  tailG: 1.30, stride: 2.4,  weave: 0.20, push: 0.03, accel: 2.8 }
};
var GAIT_KEYS = ['waveK', 'waveA', 'neck', 'tailG', 'stride', 'weave', 'push', 'accel'];
var WAVE_SLIP = 1.6;             /* wave slips back along the body at 1.6x speed */

/* ---------------- v4.3 randomized 3D head crossing ----------------
 * When the head drives across a far section of its own body, ONE fresh
 * coin-flip decision per engagement picks how the two sections separate
 * in real 3D (never by render order):
 *   OVER  - the head+neck zone rises over the crossed section, like a
 *           snake mounting its own loop;
 *   UNDER - the crossed section arches up and the head passes beneath
 *           it, the loop riding up on the animal's own neck.
 * The lift is the measured section tangency distance 1.02*(r_i+r_j)
 * plus a margin, so BOTH surfaces and the contact field (which keys on
 * centre distance) read a clean pass with no fake press. It starts
 * building CR_CAPW before the surfaces touch (the animal prepares the
 * crossing), reaches full height at tangency, and settles gradually
 * after the head has passed. The decision is LOCKED until the head has
 * cleared the section, so one engagement can never oscillate; every new
 * engagement flips again (consecutive OVER or UNDER are both possible,
 * no fixed alternation). With no engagement every field stays exactly
 * zero and movement, rest coils and collision behave exactly like
 * v4.2.2. */
var CR_HZ = 14;        /* head-zone rings (0..14) that can cross the body */
var CR_GAP = 28;       /* min along-spine gap to a crossable section;     */
                       /* rings 16-27 are the near-trailing body that     */
                       /* always rides beside the head in the S-weave and */
                       /* must never read as an obstacle (same rule the   */
                       /* v4.0 self-avoid lateral probes use)             */
var CR_TAILZ = 18;     /* tail rings beyond N-CR_TAILZ drape freely (the  */
                       /* relax guard excludes them too) - they are soft, */
                       /* thin and unprotected, never crossing obstacles  */
var CR_AHEAD = 0.10;   /* the section must lie AHEAD of the nose plane    */
var CR_CONE = 1.2;     /* corridor: forward offset must beat 1.2x lateral */
var CR_RISE_V = 1.6;   /* max lift growth rate u/s (tames sudden reveals) */
var CR_CAPW = 0.72;    /* anticipation band width before surface touch    */
var CR_RAMP = 0.70;    /* fraction of the band at which lift is full      */
var CR_EXIT = 0.38;    /* extra clearance beyond capture that ends it     */
var CR_HOLD = 0.70;    /* seconds the path must stay clear to release     */
var CR_HEAD_TOP = 0.37;/* skull crown height above the ring-0 centre      */
var CR_TOPK = 1.429;   /* ring centre -> section top, in radii (0.677r    */
                       /* centre offset + 0.752r dorsal vertex)           */
var CR_MARG = 0.06;    /* separation margin above tangency                */
var CR_W5 = [1, 4, 6, 4, 1];  /* same spine-blur kernel as the other fields */
/* v4.3.1: max lift FALL from one ring to the next, in world units. With
 * SEG = 0.10 ring spacing this caps the descent slope of the applied lift
 * profile at ~24 degrees, so the neck leaves the crest in a smooth arc
 * instead of hinging (v4.3 measured up to 57 degrees in a single ring
 * right behind the rigid skull plateau). Pure max() passes: values are
 * only ever RAISED to meet the cap, never lowered, so every clearance
 * height the need field computed is preserved exactly. */
var CR_DROP = 0.045;

/* ---------------- rig: state helpers ---------------- */
AnacondaRig.prototype._setState = function (s, dur) {
  this._state = s; this._stateT = 0;
  if (s === 'idle') { this._idleDur = dur; this._nextLook = 0.3; }
  if (s === 'run') this._runDur = dur;
  if (s === 'freeze') this._freezeDur = dur;
};

/* flee from a ground point. panic=true full burst, false = reserved slide-away */
AnacondaRig.prototype.scareFrom = function (pt, panic) {
  if (this._state === 'run' && this._stateT < 0.5) return;
  var P0 = this._P[0];
  var dx = P0.x - pt.x, dz = P0.z - pt.z;
  var L = Math.sqrt(dx * dx + dz * dz);
  var tx, tz;
  if (L < 1e-4) {
    tx = P0.x + Math.sin(this._heading + Math.PI) * 4.0;
    tz = P0.z + Math.cos(this._heading + Math.PI) * 4.0;
  } else {
    tx = P0.x + dx / L * 4.5;
    tz = P0.z + dz / L * 4.5;
  }
  var d = Math.sqrt(tx * tx + tz * tz);
  if (d > 6.2) { tx *= 6.2 / d; tz *= 6.2 / d; }
  this._target = { x: tx, z: tz };
  this._setState('run', panic ? 1.6 : 1.15);
  /* prefers-reduced-motion: it still leaves, but hurries instead of panicking */
  var panicV = this._mgr._reduced ? 0.8 : 2.3;
  var calmV = this._mgr._reduced ? 0.7 : 1.55;
  this._vTarget = (panic ? panicV : calmV) * (this._mgr._opts.speed || 1);
  this._scareCd = 1.5;
  this._afterFreeze = 'auto';
};

/* alert: stop, raise the head and stare at the disturbance */
AnacondaRig.prototype.alertFrom = function (pt, dur, after) {
  if (this._state === 'run') return;
  this._alertPoint = { x: pt.x, z: pt.z };
  this._afterFreeze = (this._afterFreeze === 'run' || after === 'run') ? 'run' : (after || 'auto');
  var P0 = this._P[0];
  var desired = Math.atan2(pt.x - P0.x, pt.z - P0.z);
  /* the head yaws only gently on the neck: a rigid lofted skull cannot
   * twist 45 degrees on a stationary neck without exposing the junction */
  this._idleYawT = clamp(angDiff(desired, this._heading), -0.34, 0.34);
  this._setState('freeze', dur || 1.0);
};

/* pick a wander target on the visible page, avoiding other snakes */
AnacondaRig.prototype._pickTarget = function (mgr, minLen) {
  var k, t;
  for (k = 0; k < 12; k++) {
    var lp = mgr._localFromNdc(rnd(-0.7, 0.7), rnd(-0.55, 0.48), mgr._tmpB);
    if (!lp) break;
    var L = Math.sqrt(lp.x * lp.x + lp.z * lp.z);
    if (L <= minLen || L >= 5.6) continue;
    for (t = 0; t < mgr._rigs.length; t++) {
      var o = mgr._rigs[t];
      if (o === this) continue;
      var oh = o._P[0];
      var dx = lp.x - oh.x, dz = lp.z - oh.z;
      if (dx * dx + dz * dz < 2.6) { L = -1; break; }
    }
    if (L < 0) continue;
    return { x: lp.x, z: lp.z };
  }
  return { x: rnd(-2, 2), z: rnd(-1.5, 2) };
};

AnacondaRig.prototype._chooseNext = function (mgr) {
  if (!mgr._reduced && Math.random() < 0.12) {
    this._target = this._pickTarget(mgr, 3.0);
    this._setState('run', rnd(0.9, 1.5));
    this._vTarget = 1.35 * (mgr._opts.speed || 1);
  } else {
    this._target = this._pickTarget(mgr, 0);
    this._cruiseJit = rnd(-0.12, 0.16);
    this._setState('walk', 0);
  }
};

/* ---------------- rig: brain ---------------- */
AnacondaRig.prototype._behavior = function (dt, time, mgr) {
  this._stateT += dt;
  this._scareCd -= dt;
  var P0 = this._P[0];
  var spd = mgr._opts.speed || 1;

  /* shy: slide away when the cursor approaches head or body */
  if (mgr._pointerLocal && mgr._opts.shy && !mgr._reduced && this._scareCd <= 0) {
    var m = mgr._pointerLocal;
    var near = false, close = false, i, q;
    for (i = 0; i < N; i += 6) {
      q = this._P[i];
      var qx = q.x - m.x, qz = q.z - m.z;
      var d2 = qx * qx + qz * qz;
      if (d2 < (i === 0 ? 3.6 : 1.7)) { near = true; }
      if (d2 < 0.85) { close = true; }
      if (close) break;
    }
    if (near) this.scareFrom(m, close);
  }

  if (this._state === 'idle') {
    this._vTarget = 0;
    if (this._stateT > this._nextLook) {
      /* v4.0: an aroused snake scans wider and more often; a resting one
       * barely looks around. Blended from the arousal scalar, so it eases
       * in and out with everything else. */
      this._idleYawT = rnd(-0.30, 0.30) * (0.85 + 0.55 * this._arousal);
      this._nextLook = this._stateT + rnd(0.9, 2.2) * (1.30 - 0.60 * this._arousal);
    }
    this._idleYaw += (this._idleYawT - this._idleYaw) * Math.min(1, dt * 2.5);
    /* curiosity: a SLOW cursor just outside flee range reads as a scent
     * trace - the snake watches it from a safe distance and samples the
     * air with extra tongue flicks (fast cursor = threat, handled above) */
    if (mgr._pointerLocal && mgr._ptrSlow > 0.6 && !mgr._reduced && this._scareCd <= 0) {
      var cx = mgr._pointerLocal.x - P0.x, cz = mgr._pointerLocal.z - P0.z;
      var cd = Math.sqrt(cx * cx + cz * cz);
      if (cd > 1.9 && cd < 3.2) {
        this._idleYawT = clamp(angDiff(Math.atan2(cx, cz), this._heading), -0.34, 0.34);
        if (this._tongueNext > 0.9) this._tongueNext = rnd(0.35, 0.9);
        this._curious += (1 - this._curious) * Math.min(1, dt * 3);
      } else {
        this._curious *= Math.exp(-3 * dt);
      }
    } else {
      this._curious *= Math.exp(-3 * dt);
    }
    if (this._stateT > this._idleDur) this._chooseNext(mgr);
  } else if (this._state === 'walk') {
    /* real serpentine locomotion: the head does not run straight at the
     * target, it carves an S-path. The weave phase advances with DISTANCE
     * travelled (in step(), gait-stride driven), so the wavelength stays
     * fixed in space (~2.3u) whatever the speed - the body chain then
     * follows the path the head traced. At crawl speed the stride pulses
     * gently (push-glide rhythm real snakes show at low speed). */
    var pulse = Math.max(0, 1 - this._speed / 0.9) * (0.5 + 0.5 * Math.sin(time * 1.0 + this._seed));
    this._vTarget = (0.42 + this._cruiseJit) * spd * (mgr._reduced ? 0.6 : 1) * (1 - 0.22 * pulse);
    var tdx = this._target.x - P0.x, tdz = this._target.z - P0.z;
    this._headingT = Math.atan2(tdx, tdz) + Math.sin(this._weavePh) * this._weaveAmp;
    if (tdx * tdx + tdz * tdz < 0.45) this._setState('idle', rnd(1.6, 5.0));
  } else if (this._state === 'run') {
    var rdx = this._target.x - P0.x, rdz = this._target.z - P0.z;
    this._headingT = Math.atan2(rdx, rdz) + Math.sin(this._weavePh) * this._weaveAmp;
    if (this._stateT > this._runDur || rdx * rdx + rdz * rdz < 0.5) {
      this._setState('idle', rnd(0.9, 2.4));
      this._scareCd = 1.3;
    }
  } else { /* freeze: alert pose, head up, staring */
    this._vTarget = 0;
    this._idleYaw += (this._idleYawT - this._idleYaw) * Math.min(1, dt * 5);
    if (this._stateT > this._freezeDur) {
      var pending = this._afterFreeze;
      this._afterFreeze = 'auto';
      if (pending === 'run') {
        this.scareFrom(this._alertPoint, true);
      } else if (pending === 'walk' || Math.random() < 0.65) {
        this._target = this._pickTarget(mgr, 0);
        this._cruiseJit = rnd(-0.12, 0.16);
        this._setState('walk', 0);
      } else {
        this._setState('idle', rnd(1.0, 2.2));
      }
    }
  }

  /* keep clear of the other snakes */
  var rigs = mgr._rigs, i, o;
  for (i = 0; i < rigs.length; i++) {
    o = rigs[i];
    if (o === this) continue;
    var oh2 = o._P[0];
    var sx = P0.x - oh2.x, sz = P0.z - oh2.z;
    var d2h = sx * sx + sz * sz;
    if (d2h < 2.6) {
      var away = Math.atan2(sx, sz);
      this._headingT += clamp(angDiff(away, this._heading), -1, 1) * dt * 2.5;
    }
  }

  /* and never crawl into its own body */
  this._selfAvoid(dt);
};

/* stay inside the visible page area */
AnacondaRig.prototype._checkBounds = function (mgr) {
  var v = this._vA.set(this._R[10].x, 0.3, this._R[10].z);
  mgr._root.localToWorld(v);
  v.project(mgr._camera);
  if (v.x < -0.86 || v.x > 0.86 || v.y > 0.62 || v.y < -0.72) {
    var lp = mgr._localFromNdc(0, -0.06, mgr._tmpB);
    if (lp) {
      this._target = { x: lp.x, z: lp.z };
      if (this._state === 'idle') { this._cruiseJit = 0; this._setState('walk', 0); }
    }
  }
};

/* ---------------- rig: physics + pose ---------------- */
AnacondaRig.prototype.step = function (dt, time, mgr) {
  this._behavior(dt, time, mgr);

  /* ---- v3.0 gait selection + blending ----
   * The gait describes HOW the animal is moving right now; it is picked
   * from the brain state, the current speed and how hard the heading
   * target is pulling (a big pending turn = dedicated turning gait).
   * Parameters blend at ~3.5/s, so a gait change is a transition, not
   * a pop. */
  var pending = Math.abs(angDiff(this._headingT, this._heading));
  var gait;
  if (this._state === 'idle' || this._state === 'freeze') gait = 'rest';
  else if (this._state === 'walk') gait = pending > 0.9 ? 'turn' : (this._speed < 0.3 ? 'crawl' : 'cruise');
  else gait = (this._speed > 1.5 && this._stateT < 0.8) ? 'escape' : (this._speed > 0.85 ? 'fast' : 'crawl');
  if (mgr._reduced && gait === 'escape') gait = 'fast';   /* hurry, no burst */
  this._gait = gait;
  var tgt = GAITS[gait], gp = this._gp, bl = Math.min(1, dt * 3.5), gk, gi;
  for (gi = 0; gi < GAIT_KEYS.length; gi++) {
    gk = GAIT_KEYS[gi];
    gp[gk] += (tgt[gk] - gp[gk]) * bl;
  }
  /* S-weave amplitude for the coming frames: gait base x slow organic
   * drift (two out-of-phase LFOs - no two sweeps of the S are identical).
   * A fleeing snake straightens out: the weave shrinks as speed rises. */
  this._weaveAmp = gp.weave * (this._state === 'run' ? (1.05 - 0.30 * Math.min(this._speed / 2.0, 1)) : 1)
    * (1 + 0.20 * Math.sin(time * 0.21 + this._seed) + 0.10 * Math.sin(time * 0.53 + this._seed * 2.1));

  /* ---- turning: rate-limited angular velocity ----
   * The turn rate accelerates and decelerates smoothly toward the rate
   * the heading target asks for; nothing snaps. Turns therefore begin at
   * the head, and the rest of the spine inherits them ring by ring
   * through the chain follow below. */
  var desired = angDiff(this._headingT, this._heading);
  var turnCap = (this._state === 'run' ? 2.7 : 1.7) * (1.15 - 0.28 * Math.min(this._speed / 1.8, 1));
  /* a heavy body cannot bend tighter than its speed allows: enforce a
   * minimum turn radius (r = v / w) so panic coils never fold through
   * themselves; at rest the cap eases to a gentle 0.5 rad/s */
  turnCap = Math.min(turnCap, this._speed / 1.05 + 0.5);
  var tAcc = this._state === 'run' ? 9.0 : 6.5;
  var tgtRate = clamp(desired * 5.0, -turnCap, turnCap);
  this._turnVel += clamp(tgtRate - this._turnVel, -tAcc * dt, tAcc * dt);
  this._heading += this._turnVel * dt;
  /* the head banks slightly INTO the turn it is carving */
  this._roll += (clamp(this._turnVel, -3, 3) * 0.045 - this._roll) * Math.min(1, dt * 6);
  this._prevHeading = this._heading;

  /* speed approaches its target at the gait's own acceleration; threading
   * through cramped space (own coil, another snake) eases the throttle -
   * but a panic run never loses more than 30%, so the escape burst can
   * always reach full sprint (relax + steering keep the coil open) */
  var vEff = this._vTarget * (1 - (this._state === 'run' ? 0.30 : 0.45) * this._avoidSlow);
  this._speed += (vEff - this._speed) * Math.min(1, dt * gp.accel);
  if (this._speed < 0.002) this._speed = 0;

  /* agitation drives the tail flick: full while fleeing, decays after
   * (reduced-motion users never get the nervous flick) */
  if (this._state === 'run' && !mgr._reduced) this._agitate = 1;
  else this._agitate *= Math.exp(-1.6 * dt);
  /* post-run panting: rises with sustained speed, fades slowly after */
  var pantTgt = this._speed > 1.0 ? 1 : 0;
  this._pant += (pantTgt - this._pant) * Math.min(1, dt * (pantTgt ? 2.5 : 0.7));

  /* ---- locomotion ----
   * push: a subtle surge synced to the wave phase (the body gains ground
   * on the push half of each stride). The wave phases advance with
   * DISTANCE, so they freeze with the animal and are fps-independent. */
  var sn = clamp(this._speed / 2.0, 0, 1);
  var push = mgr._reduced ? 0 : gp.push * sn;
  var fx = Math.sin(this._heading), fz = Math.cos(this._heading);
  var move = this._speed * dt * (1 + push * Math.sin(this._waveD - 0.8));
  if (this._state === 'walk' || this._state === 'run') {
    this._weavePh += (this._speed * dt / gp.stride) * TAU;
    this._waveD += (this._speed * dt / SEG) * gp.waveK * WAVE_SLIP;
  }
  var P = this._P;
  P[0].x += fx * move; P[0].z += fz * move;

  /* spine chain follow (the body traces the path of the head) */
  for (var i = 1; i < N; i++) {
    var dx = P[i].x - P[i - 1].x, dz = P[i].z - P[i - 1].z;
    var d = Math.sqrt(dx * dx + dz * dz);
    if (d > 1e-6) {
      var fr = SEG / d;
      P[i].x = P[i - 1].x + dx * fr;
      P[i].z = P[i - 1].z + dz * fr;
    }
  }

  /* ---- gait-driven travelling wave ----
   * The big S-curves come from the head's woven path (the chain above);
   * this wave is the muscular layer on top: it travels front -> rear,
   * ramps in over the stiff neck, and gains flexibility toward the tail.
   * A per-ring low-pass (stiff neck -> loose tail) delays the offset ring
   * by ring: the follow-through whip of the back half. */
  this._phase += dt * TAU * (0.35 + this._speed * 0.5);
  /* rest blends in smoothly (was a hard binary switch before v3.0); the
   * locomotion wave fades out as the animal settles, the rest sway fades in */
  this._idleAmt += ((this._speed < 0.1 ? 1 : 0) - this._idleAmt) * Math.min(1, dt * 2.2);
  var idleAmt = this._idleAmt;
  var redMul = mgr._reduced ? 0.65 : 1;
  var amp = gp.waveA * (1 - 0.85 * idleAmt) * redMul
    * (1 + 0.28 * Math.sin(time * 0.31 + this._seed) + 0.14 * Math.sin(time * 0.71 + this._seed * 1.7));

  /* alert: raise the head and the front third of the body */
  this._alert += (((this._state === 'freeze') ? 1 : 0) - this._alert) * Math.min(1, dt * 4);

  var wSm = this._waveSm;
  for (i = 0; i < N; i++) {
    var a = P[i > 0 ? i - 1 : 0], b = P[i < N - 1 ? i + 1 : N - 1];
    var sdx = b.x - a.x, sdz = b.z - a.z;
    var sl = Math.sqrt(sdx * sdx + sdz * sdz) || 1;
    sdx /= sl; sdz /= sl;
    this._dirs[i].x = sdx; this._dirs[i].z = sdz;
    var px = -sdz, pz = sdx;
    var tt = i / (N - 1);
    /* neck ramp-in, then growing flexibility toward the tail tip */
    var env = i < gp.neck ? (i / gp.neck) : 1;
    env = env * env * (3 - 2 * env);
    var tailF = tt > 0.55 ? 1 + (tt - 0.55) * gp.tailG : 1;
    var w = Math.sin(this._waveD - i * gp.waveK) * amp * env * tailF;
    /* faint faster secondary ripple: keeps the surface from looking looped */
    w += Math.sin(this._waveD * 1.7 - i * gp.waveK * 2.3 + 2.1) * amp * 0.35 * env;
    /* per-ring follow-through: neck answers fast, tail lags and whips */
    var ws = wSm[i], rate = 18 - 9 * tt;
    ws += (w - ws) * Math.min(1, dt * rate);
    wSm[i] = ws;
    w = ws;
    /* agitated tail flick: fast shimmer running down the last quarter */
    if (this._agitate > 0.02 && i > N - 22) {
      var tf = (i - (N - 22)) / 22;
      w += Math.sin(time * 24 - i * 1.3) * 0.05 * this._agitate * tf;
    }
    if (idleAmt > 0.01) {
      w += (Math.sin(time * 1.0 - i * 0.34) * 0.020
        + Math.sin(time * 0.42 + this._seed - i * 0.12) * 0.009) * tailF * idleAmt;
    }
    var liftA = Math.max(this._alert, this._curious * 0.35);
    var lift = liftA * 0.34 * Math.pow(Math.max(0, 1 - i / 13), 1.3);
    var bob = sn * Math.sin(this._phase * 2 - i * 0.5) * 0.010;
    this._R[i].set(P[i].x + px * w, 0.02 + lift + bob, P[i].z + pz * w);
  }

  /* v4.3: randomized over/under crossing - when the head drives across
   * its own body, take ONE fresh OVER/UNDER decision per engagement and
   * separate the two sections vertically (the head+neck rises OVER, or
   * the crossed section arches and the head passes UNDER). The fields
   * are exactly zero whenever no crossing is engaged, so free crawl,
   * rest and coils behave exactly like v4.2.2. Runs before relax so the
   * guard, the contact shading and the ground press all see the
   * separated 3D geometry. */
  this._updateCrossing(dt);

  /* self-intersection guard: gentle relaxation between render rings far
   * apart along the spine but close in space (only coils produce these) */
  this._relaxBody(dt);

  /* ---- v4.0 arousal: one continuous calm <-> alert scalar ----
   * Resting ~0.16, walking ~0.42, curious idle up to ~0.76, staring at a
   * disturbance 0.85, fleeing 1.0. Blended at 2/s, so everything driven by
   * it - tongue-flick rate, head scanning, breathing pace, head sway -
   * eases between calm and alert instead of switching. */
  var aTgt;
  if (this._state === 'run') aTgt = 1.0;
  else if (this._state === 'freeze') aTgt = 0.85;
  else if (this._state === 'walk') aTgt = 0.42 + this._curious * 0.30;
  else aTgt = 0.16 + this._curious * 0.60;
  if (this._alert * 0.9 > aTgt) aTgt = this._alert * 0.9;
  if (this._pant * 0.55 > aTgt) aTgt = this._pant * 0.55;
  this._arousal += (aTgt - this._arousal) * Math.min(1, dt * 2.0);

  this._updateBody(time, idleAmt, dt);
  this._updateHead(time, sn, idleAmt);
  this._updateYawn(dt);
  this._updateTongue(dt, time);
  this._updateShadows();
  this._checkBounds(mgr);
};

/* keep the persistent spine path from folding through itself: two probe
 * points ahead of the head sense the snake's own body; steering away from
 * it is what keeps coils from being laid through each other (a real snake
 * simply never crawls into its own coil). The probe distance grows with
 * speed (a fast animal must see further ahead) and a near hit also dampens
 * the speed - tightening the achievable turn radius, exactly how a real
 * snake threads through cramped space. v4.0 adds two lateral probes: panic
 * reversals can sweep the NECK sideways into the rear body, which straight
 * ahead probes never see. Runs inside _behavior, so the turn dynamics in
 * step() still smooth the resulting heading. */
AnacondaRig.prototype._selfAvoid = function (dt) {
  if (this._speed <= 0.15) return;
  var P = this._P, P0 = P[0];
  var hsin = Math.sin(this._heading), hcos = Math.cos(this._heading);
  var pr, i, hit = 0;
  for (pr = 0; pr < 2; pr++) {
    var pd = (pr ? 1.8 : 0.8) + this._speed * (pr ? 0.55 : 0.30);
    var ax = P0.x + hsin * pd, az = P0.z + hcos * pd;
    for (i = 12; i < N - 4; i += 3) {
      var qx = P[i].x - ax, qz = P[i].z - az;
      var lim = (RAD[i] + (pr ? 0.55 : 0.42)) * (pr ? 0.85 : 0.88);
      if (qx * qx + qz * qz < lim * lim) {
        var away = Math.atan2(ax - P[i].x, az - P[i].z);
        /* v4.3: a section the head is committed to crossing (engagement
         * field > 0) steers less - the 3D separation carries the head
         * across instead of grinding along the loop. The ease grows to
         * 0.95 at full engagement: a committed crossing must complete
         * even along a long wall. No engagement -> factor 1 -> identical
         * to v4.2.2. */
        var cwv = this._crRing[i];
        /* committed standdown: once the coin flip picked a crossing for
         * this section, avoidance stops steering against it entirely -
         * even 25% residual push outweighs the target pull (0.72 rad/s
         * turn cap) and pins the head at the capture edge of a long
         * wall. The 3D lift now provides the separation. */
        if (this._crMode !== 0 && cwv > 0) cwv = 1;
        var kSteer = cwv > 0 ? 1 - 0.95 * cwv : 1;
        this._headingT += clamp(angDiff(away, this._heading), -1, 1) * dt * (pr ? 2.5 : 4.5) * kSteer;
        if (pr === 0) hit = 1;
        break;
      }
    }
  }
  /* lateral probe fan: two distances, each side - the outer pair catches
   * the outgoing leg of a panic U-turn early, the inner pair covers the
   * gap next to the head. Far body only (rings 28+): the near-trailing
   * body always rides beside the head during an S-weave and must never
   * read as an obstacle (it would throttle every run), while the mid/rear
   * body beside the path is exactly the loop a U-turn is about to hit. */
  var side, sl, so;
  for (side = -1; side <= 1; side += 2) {
    for (so = 0.45; so <= 1.05; so += 0.6) {
      sl = 0.7 + this._speed * 0.25 + (so > 1 ? 0.5 : 0);
      var lx = P0.x + hsin * sl - hcos * so * side;
      var lz = P0.z + hcos * sl + hsin * so * side;
      for (i = 28; i < N - 6; i += 3) {
        var mx2 = P[i].x - lx, mz2 = P[i].z - lz;
        var mlim = (RAD[i] + 0.38) * 0.85;
        if (mx2 * mx2 + mz2 * mz2 < mlim * mlim) {
          var maway = Math.atan2(lx - P[i].x, lz - P[i].z);
          /* v4.3: same crossing ease as the forward probes */
          var cwl = this._crRing[i];
          if (this._crMode !== 0 && cwl > 0) cwl = 1;
          var kSteerL = cwl > 0 ? 1 - 0.95 * cwl : 1;
          this._headingT += clamp(angDiff(maway, this._heading), -1, 1) * dt * 4.2 * kSteerL;
          /* throttle only when the far body is actually AHEAD of the nose
           * (the incoming loop of a U-turn), and never during the first
           * 0.9 s of a panic burst - the burst must always be allowed to
           * reach full sprint; steering and relax still protect it */
          var rxd = P[i].x - P0.x, rzd = P[i].z - P0.z;
          var rlen = Math.sqrt(rxd * rxd + rzd * rzd) || 1;
          if (rxd * hsin + rzd * hcos > 0.25 * rlen &&
              !(this._state === 'run' && this._stateT < 0.9)) hit = 1;
          break;
        }
      }
    }
  }
  /* cramped space: ease off the throttle so the turn radius shrinks with
   * it (smooth 0..1 factor, applied by the speed integrator in step) */
  this._avoidSlow += ((hit ? 1 : 0) - this._avoidSlow) * Math.min(1, dt * 5);
};

/* relax overlaps between rings that are >= 10 rings apart along the spine
 * but spatially close. The rope constraint only guarantees chain distance,
 * so a coil lays loops against each other; this nudges them apart until
 * they just touch (like a real coiled snake). Four fast Gauss-Seidel
 * passes with a per-pair push cap, then a per-ring clamp: bounded, pop
 * free, and strong enough to hold a coil open. The pair search runs to 60
 * rings apart (v4.0, was 48): one full coil puts rings ~40 apart shoulder
 * to shoulder, and a panic coil can also lay the rear body over the mid
 * body (pairs up to ~55 apart). The head zone (rings 0-3, wrapped by the
 * skull loft) is excluded. */
AnacondaRig.prototype._relaxBody = function (dt) {
  var R = this._R, rlxX = this._rlxX, rlxZ = this._rlxZ, i, j, p;
  for (i = 0; i < N; i++) { rlxX[i] = R[i].x; rlxZ[i] = R[i].z; }
  for (p = 0; p < 4; p++) {
    /* ring N-18 onward is the thin tail: it is excluded from the guard on
     * purpose - a real snake drapes its tail over its own coil, and the
     * Stage 1 tail flick must stay free to whip without relax damping it */
    var iEnd = N - 18;
    for (i = 4; i < iEnd - 10; i++) {
      var Ri = R[i];
      var jEnd = i + 60 < iEnd ? i + 60 : iEnd;
      for (j = i + 10; j < jEnd; j++) {
        var dx = Ri.x - R[j].x, dz = Ri.z - R[j].z;
        var ad = dx < 0 ? -dx : dx;
        if (ad > 0.85) continue;
        ad = dz < 0 ? -dz : dz;
        if (ad > 0.85) continue;
        var minD = (RAD[i] + RAD[j]) * 0.98;
        var d2 = dx * dx + dz * dz;
        if (d2 >= minD * minD || d2 < 1e-9) continue;
        var d = Math.sqrt(d2);
        /* the neck (visually critical, always on camera) gets a stronger
         * push so a panic sweep can never drive it through the body */
        var cap = (i < 16 || j < 16) ? 0.030 : 0.018;
        var f = Math.min((minD - d) * 0.45, cap) / d;
        /* v4.3: a pair that is being crossed in 3D (head lifted OVER it
         * or the section arched UNDER it) is already separated
         * vertically - ease its horizontal push so relax helps the
         * crossing instead of fighting it. Zero engagement -> factor 1
         * -> identical to v4.2.2. */
        var cw = this._crRing[i] > this._crRing[j] ? this._crRing[i] : this._crRing[j];
        if (cw > 0) f *= 1 - 0.85 * cw;
        var mx = dx * f, mz = dz * f;
        Ri.x += mx; Ri.z += mz;
        R[j].x -= mx; R[j].z -= mz;
      }
    }
  }
  /* apply the relax result through a per-ring LOW-PASS: the desired push
   * offset ramps in/out at a bounded rate instead of snapping, so a panic
   * coil is pushed apart just as hard as before but no ring ever JERKS -
   * the applied offset changes at most ~0.035u per 1/60 s on top of smooth
   * path motion. Without this, pushes that activate/deactivate between
   * frames read as single-frame pops.
   * v4.2: the desired push is first blurred along the spine (3-tap), so
   * neighbouring rings always move by near-equal amounts - a push field
   * that differed ring to ring used to fold small sawtooth ridges into
   * the coil rim. The ramp cap is per-SECOND now, not per-frame: the push
   * profile is identical at 30, 60 and 144 fps. */
  var rtX = this._roTX, rtZ = this._roTZ;
  for (i = 0; i < N; i++) { rtX[i] = R[i].x - rlxX[i]; rtZ[i] = R[i].z - rlxZ[i]; }
  for (i = 0; i < N; i++) {
    var iLo = i > 0 ? i - 1 : 0, iHi = i < N - 1 ? i + 1 : N - 1;
    var tx = 0.25 * rtX[iLo] + 0.5 * rtX[i] + 0.25 * rtX[iHi];
    var tz = 0.25 * rtZ[iLo] + 0.5 * rtZ[i] + 0.25 * rtZ[iHi];
    /* the neck ramps faster: bursting out of a coiled rest drags it across
     * the body, and it must be shoveled clear quickly */
    var roRate = (i < 20 ? 3.0 : 2.1) * dt;
    var ox = this._roX[i], oz = this._roZ[i];
    var dxa = tx - ox, dza = tz - oz;
    var mag = Math.sqrt(dxa * dxa + dza * dza);
    if (mag > roRate) { dxa *= roRate / mag; dza *= roRate / mag; }
    ox += dxa; oz += dza;
    var om = Math.sqrt(ox * ox + oz * oz);
    if (om > 0.22) { ox *= 0.22 / om; oz *= 0.22 / om; }   /* no windup */
    this._roX[i] = ox; this._roZ[i] = oz;
    R[i].x = rlxX[i] + ox;
    R[i].z = rlxZ[i] + oz;
  }
  /* (v4.1: contact recording moved to _updateBody, where it runs on the
   * smoothed VISUAL chain so the shading matches what is actually seen) */
};

/* ---------------- v4.3 randomized 3D head crossing ----------------
 * Why this exists: every ring centre was ground-locked (y = 0.02 + alert
 * lift), relax pushes horizontally only and never touches rings 0-3, so
 * a head that could not steer around its own body met it at identical
 * height and every crossing read as the head sliding UNDER. There was
 * no over/under mechanic at all.
 *
 * What this does, per frame:
 *   1) capture - pure geometry on the persistent spine path: which
 *      head-zone rings (0..14) are driving into a section >= 28 rings
 *      behind the head, ahead of the nose, while the animal moves.
 *      The trailing S-body beside the head is never an obstacle.
 *   2) decision - one coin flip starts an engagement (OVER = 1,
 *      UNDER = 2); the decision is then locked until the head has
 *      cleared the section by CR_EXIT for CR_HOLD seconds, so an
 *      engagement cannot oscillate. A fresh flip starts every new
 *      engagement: consecutive OVER or UNDER are both possible.
 *   3) need - per captured pair, the vertical separation that makes the
 *      pair clean in 3D: at least the section tangency distance
 *      1.02*(r_i+r_j) (keeps the contact field, which keys on centre
 *      distance, silent) and at least the measured surface need, plus
 *      a margin. OVER applies it to the head ring, UNDER to the crossed
 *      ring (the loop arches over the passing skull/neck). The ramp
 *      starts at CR_CAPW before touch (anticipation) and is full before
 *      the surfaces meet.
 *   4) continuity - exponential smoothing in seconds (rise 8/s, settle
 *      2.3/s: the crossing fades in on approach, the body settles back
 *      gradually afterwards) then the same 5-tap binomial spine blur
 *      the other fields use - the separation can never step between
 *      neighbouring rings.
 *   5) apply - added to ring y (rebuilt from scratch every frame in the
 *      locomotion loop, so nothing accumulates). Rings 0-3 share one
 *      lift: the skull loft wraps them rigidly and the junction must
 *      stay shut while the head mounts a section. _crRing stores the
 *      normalized engagement that eases relax and self-avoid below.
 * Runs before _relaxBody and _updateBody so every downstream system
 * (relax, contact shading, ground press, shadows, head attach) sees the
 * separated geometry. */
AnacondaRig.prototype._updateCrossing = function (dt) {
  var R = this._R, P = this._P, i, j, k;
  var rawI = this._crIraw, rawJ = this._crJraw;
  for (i = 0; i < N; i++) { rawI[i] = 0; rawJ[i] = 0; }

  /* 1) capture pairs (persistent path, not the relax-shifted rings).
   *    Each pair must pass three gates: tangency-scaled distance band,
   *    ahead of the nose plane, and a forward corridor - the section
   *    must lie mostly AHEAD of the head ring, not beside it (the
   *    S-weave keeps trailing loops permanently beside the head).
   *    The speed gate only excludes true rest (speed -> 0): it must sit
   *    well BELOW the cramped-space crawl throttle (~0.11-0.13 u/s), or
   *    a committed approach would flicker out of capture exactly when
   *    the animal eases off its throttle to cross. */
  var pb = this._crPB, pn = 0;
  if (this._speed > 0.05) {
    var hsin = Math.sin(this._heading), hcos = Math.cos(this._heading);
    var P0 = P[0];
    for (i = 0; i <= CR_HZ; i++) {
      var Pi = P[i];
      for (j = i + CR_GAP; j < N - CR_TAILZ; j++) {
        var dx = Pi.x - P[j].x, dz = Pi.z - P[j].z;
        var ad = dx < 0 ? -dx : dx;
        if (ad > 1.35) continue;
        ad = dz < 0 ? -dz : dz;
        if (ad > 1.35) continue;
        var dXZ = Math.sqrt(dx * dx + dz * dz);
        var dT = 1.02 * (RAD[i] + RAD[j]);      /* surface tangency       */
        var capW = CR_CAPW * clamp(dT / 0.62, 0.6, 1);  /* band ~ section size */
        if (dXZ >= dT + capW + CR_EXIT) continue;      /* outside hysteresis */
        if (this._crMode === 0) {
          /* only a section ahead of the nose is a crossing obstacle.
           * v4.3.1: this nose-plane gate (and the corridor below) now
           * gates NEW engagements ONLY, exactly as v4.3 gated every
           * frame - so the coin flip still fires at the same place and
           * moment, and the 50/50 random selection is untouched. */
          if ((P[j].x - P0.x) * hsin + (P[j].z - P0.z) * hcos < CR_AHEAD) continue;
          /* forward corridor: mostly ahead of the head ring itself */
          var fx2 = P[j].x - Pi.x, fz2 = P[j].z - Pi.z;
          var fwd = fx2 * hsin + fz2 * hcos;
          var lat = fx2 * hcos - fz2 * hsin;
          if (lat < 0) lat = -lat;
          if (fwd < CR_CONE * lat) continue;
        } else {
          /* v4.3.1 engaged-crossing hold: the pair is kept alive by the
           * CAPTURING RING's own geometry. In v4.3 the nose-plane gate
           * above ran on every frame, so the instant the nose crossed
           * the section line every pair dropped out of capture; after
           * CR_HOLD the engagement released and the lift collapsed
           * under neck rings that were still directly over the crossed
           * section - the neck sank into the loop and the overlap
           * squash dented both tubes until it all cleared (the
           * temporary OVER-crossing deformation). Here the section may
           * not lie more than CR_AHEAD BEHIND this ring's own forward
           * direction, so each head-zone ring keeps its lift until
           * THAT ring has slid past the section; the crest travels
           * down the neck with the crossing point and the settle only
           * starts once the whole head zone is through. */
          var fi = -((P[j].x - Pi.x) * this._dirs[i].x +
                     (P[j].z - Pi.z) * this._dirs[i].z);
          if (fi < -CR_AHEAD) continue;
        }
        if (pn < 1024) {
          pb[pn * 5] = i; pb[pn * 5 + 1] = j;
          pb[pn * 5 + 2] = dT; pb[pn * 5 + 3] = dXZ; pb[pn * 5 + 4] = capW;
          pn++;
        }
      }
    }
  }
  this._crPN = pn;

  /* 2) engagement state machine (one locked decision per engagement).
   *    The FIRST decision additionally requires the head to be CLOSING
   *    on the section (nearest captured distance shrinking): a weave
   *    that merely swings past a trailing loop must not burn the coin
   *    flip while receding. */
  var captured = false, minD = Infinity;
  for (k = 0; k < pn; k++) {
    var dK = pb[k * 5 + 3];
    if (dK < pb[k * 5 + 2] + pb[k * 5 + 4]) captured = true;
    if (dK < minD) minD = dK;
  }
  if (this._crMode === 0) {
    if (captured && minD < this._crPrevD) {

      this._crLastMode = this._crMode;

   *    the centre-distance need (keeps the contact field silent) and
   *    the surface need (keeps the actual skins apart even where a fat
   *    neck crosses a thin tail), plus one shared margin. Whatever the
   *    mode, the pair's closeness also feeds the engagement-ease field
   *    that softens self-avoid and relax while the head closes in, so
   *    an engaged crossing can actually complete. */
  var prRaw = this._crPraw;
  for (i = 0; i < N; i++) prRaw[i] = 0;
  if (pn > 0) {

        var hu = top - R[j2].y;

   *    at CR_RISE_V u/s - tripled once the pair is inside tangency, so
   *    urgency beats smoothness exactly when contact is imminent) then
   *    the 5-tap binomial spine blur. Settle is the plain slow
   *    exponential: the body eases back onto the ground gradually. */

     * tracks pure geometry, and its job is to yield, never to push) */
    var aP = prRaw[i], bP = this._crPsm[i];

   * junction can never open while the head mounts a section. Applied
   * BEFORE the fall-rate cap below, so the cap's forward invariant also
   * covers the plateau's downstream edge - the crest must leave the
   * rigid skull zone through the same gentle-arc bound as everywhere
   * else. */
  var m4 = outI[0];

   * UNDER arch (outJ) loses its equally steep wedge flanks. */

/* rebuild the skin tube around the spine.

 * narrows (lateral compression of the back half and tail) and a subtle

       * (separation a tiny fraction of the touching distance) the normal

       * jittering frame to frame and kinking the squash. */

   *    field is symmetric (it just points at the partner), so without the
   *    sign match a partner switch could swing it 180 degrees at once.
   *    Frames whose contact pair is too close to define a normal (ctW 0)
   *    leave the stored direction untouched.

   *    averaged directly; the direction is averaged strength-weighted and
   *    sign-aligned to the ring's own direction first, so rings pointing
   *    at opposite partners merge into one stable pressed area instead of

   *     reading the SAME _waveD/_gp.waveK phase the gait wave and the
   *     push surge use, scaled by how hard the animal is driving;
   *   - real ground gap: R[i].y sits at its resting height while the

   *     front-mid body flattens hardest and the tail barely at all.

    var contact = 1 - clamp(gapY / GAP_OUT, 0, 1);
    var wgt = (RAD[i] * RAD[i]) / (RADMAX * RADMAX);
    var pushW = Math.max(0, Math.sin(this._waveD - i * gpr.waveK)) * pushEff;
    /* the skull loft wraps rings 0-2 with the STATIC cross-section:
     * fade the press in over rings 0-6 so the junction can never step */
    var jr = Math.min(1, i / 6);
    jr = jr * jr * (3 - 2 * jr);

    for (kG = 0; kG < 5; kG++) {

      iiG = iiG < 0 ? 0 : (iiG > N - 1 ? N - 1 : iiG);

  var brA = 0.012 + idleAmt * 0.026 + this._pant * 0.05;
  var brF = 1.55 + this._arousal * 0.9 + this._pant * 2.2;
  /* travelling muscle bulge while crawling (subtle, strongest mid-body) */

  var HV = 0.94;    /* vertical squash: slightly wider than tall      */
  var BF = 0.90;    /* extra flatten factor at the belly (up < 0)     */

    var ripple = Math.sin(time * 2.6 - i * 0.52) * rippleA * Math.max(0.25, Math.min(1, i / 14)) *

     * deepens by the press depth gA2[i] (zero wherever the body is free
     * of the ground). The ring centre is lowered by exactly the amount
     * the deeper flatten pulls the bottom edge up (0.80 * 3.2 * depth
     * in this cross-section's parameterisation), so the flattened belly
     * STAYS anchored on the ground line while the top of the section

     * Zero press reproduces the old cross-section exactly. */

    var ux = upv[i].x, uy = upv[i].y, uz = upv[i].z;

     * and tail narrow while keeping their depth) and a gentle dorsal keel
     * over the front-mid back */

    s2 = s2 * s2 * (3 - 2 * s2);

      var vf2 = up < 0 ? 1 + (1 - vf) * 0.55 : 1;           /* keep girth    */

      var sn2 = sn * r * vf2;         /* right component */

       * this also pulls in the jagged per-ring scallops the coil rim
       * otherwise shows. Contact data is zero in free crawl: no effect. */
      sn2 *= lat * (1 - 0.12 * ctA2[i]);                         /* taper */
      /* v4.1: flesh squash + crease shading where the body lies over

  this._onMoveBound = function (ev) { self._onPointerMove(ev); };
  this._onDownBound = function (ev) { self._onPointerDown(ev); };
  this._onScrollBound = function () { self._onScroll(); };
  this._onVisBound = function () {
    self._setHidden(!!(document.visibilityState === 'hidden' || document.hidden));
  };
  window.addEventListener('resize', this._onResize);
  window.addEventListener('pointermove', this._onMoveBound, { passive: true });
  window.addEventListener('pointerdown', this._onDownBound, { passive: true });
  window.addEventListener('scroll', this._onScrollBound, { passive: true });
  document.addEventListener('visibilitychange', this._onVisBound);
  this._lastScrollY = window.scrollY || 0;

  this._resize();

  /* render loop: frame-rate independent dt, adaptive quality measurement,
   * full pause when the tab is hidden */
  var clock = new T.Clock();
  this._clock = clock;
  function nowMs() { return (typeof performance !== 'undefined' && performance.now) ? performance.now() : Date.now(); }
  this._loop = function () {
    self._rafId = requestAnimationFrame(self._loop);
    var dt = clock.getDelta();
    if (dt <= 0) return;
    dt = Math.min(dt, 0.05);
    var t0 = nowMs();
    self.step(dt);
    renderer.render(self._scene, self._camera);
    self._adaptQuality(nowMs() - t0);
  };
  this._rafId = requestAnimationFrame(this._loop);
};

AnacondaWalk.prototype._resize = function () {
  var w = window.innerWidth, h = window.innerHeight;
  this._renderer.setSize(w, h, false);
  this._camera.aspect = w / h;
  this._camera.updateProjectionMatrix();
  this._camera.updateMatrixWorld();
  this._camera.matrixWorldInverse.copy(this._camera.matrixWorld).invert();
  this._root.scale.setScalar(this._computeScale(w / h));
  this._root.updateMatrix();
  this._root.updateMatrixWorld(true);
};

/* ---------------- pause / resume ---------------- */
AnacondaWalk.prototype._setHidden = function (hidden) {
  if (this._destroyed || hidden === this._hidden) return;
  this._hidden = hidden;
  if (hidden) {
    if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = 0; }
  } else if (this._loop) {
    if (this._clock) this._clock.getDelta();   /* flush the paused time */
    this._rafId = requestAnimationFrame(this._loop);
  }
};

/* ---------------- adaptive rendering quality ----------------
 * Watches the real frame cost: if the average climbs above ~27 ms the pixel
 * ratio steps down (never below 0.75); if there is comfortable headroom it
 * steps back up to the device cap. */
AnacondaWalk.prototype._adaptQuality = function (ms) {
  var q = this._q;
  if (!q || this._hidden) return;
  if (q.cool > 0) { q.cool--; return; }
  q.acc += ms; q.n++;
  if (q.n < 45) return;
  var avg = q.acc / q.n;
  q.acc = 0; q.n = 0;
  if (avg > 27 && q.dpr > 0.75) {
    q.dpr = Math.max(0.75, q.dpr * 0.8);
    q.cool = 150;
    this._applyDpr();
  } else if (avg < 13.5 && q.dpr < q.cap) {
    q.dpr = Math.min(q.cap, q.dpr * 1.12);
    q.cool = 300;
    this._applyDpr();
  }
};

AnacondaWalk.prototype._applyDpr = function () {
  if (!this._renderer) return;
  this._renderer.setPixelRatio(this._q.dpr);
  this._renderer.setSize(window.innerWidth, window.innerHeight, false);
};

/* ---------------- full teardown ----------------
 * Frees every tracked geometry, material and texture, disposes the GL
 * context, removes all listeners and the canvas, and re-enables a later
 * initialization. Safe to call twice. */
AnacondaWalk.prototype.destroy = function () {
  if (this._destroyed) return;
  this._destroyed = true;
  if (this._rafId) { cancelAnimationFrame(this._rafId); this._rafId = 0; }

  if (typeof window !== 'undefined') {
    if (this._onResize) window.removeEventListener('resize', this._onResize);
    if (this._onMoveBound) window.removeEventListener('pointermove', this._onMoveBound);
    if (this._onDownBound) window.removeEventListener('pointerdown', this._onPointerDown);
    if (this._onScrollBound) window.removeEventListener('scroll', this._onScrollBound);
  }
  if (typeof document !== 'undefined' && this._onVisBound) {
    document.removeEventListener('visibilitychange', this._onVisBound);
  }
  if (this._mqUnbind) { try { this._mqUnbind(); } catch (e) {} }
  this._mqUnbind = null;

  if (this._canvas && this._canvas.parentNode) this._canvas.parentNode.removeChild(this._canvas);
  this._canvas = null;

  if (this._renderer) {
    try { this._renderer.dispose(); } catch (e) {}
    try { this._renderer.forceContextLoss(); } catch (e) {}
  }
  this._renderer = null;

  var i;
  for (i = 0; i < this._geos.length; i++) { try { this._geos[i].dispose(); } catch (e) {} }
  for (i = 0; i < this._mats.length; i++) { try { this._mats[i].dispose(); } catch (e) {} }
  for (i = 0; i < this._texs.length; i++) { try { this._texs[i].dispose(); } catch (e) {} }
  this._geos.length = 0; this._mats.length = 0; this._texs.length = 0;

  if (this._rigs) this._rigs.length = 0;
  this._pointer = null; this._pointerLocal = null; this._ptrPrev = null;
  this._loop = null; this._clock = null;

  /* only the auto-booted instance unlocks auto-boot again */
  if (ROOT.anacondaWalk === this) {
    ROOT.anacondaWalk = null;
    ROOT.__anacondaBooted = false;
  }
};

/* ---------------- main loop ---------------- */
AnacondaWalk.prototype.step = function (dt) {
  dt = clamp(dt, 0.0001, 0.05);
  this._time += dt;
  this._scrollEnergy *= Math.exp(-2.5 * dt);
  this._root.updateMatrixWorld(true);

  if (this._pointer && this.opts.shy) {
    var lp = this._localFromNdc(this._pointer.x, this._pointer.y, this._tmpC || (this._tmpC = new this._T.Vector3()));
    if (lp) {
      /* smoothed cursor speed: only a SLOW cursor reads as curiosity, a fast
       * one stays a threat */
      if (this._ptrPrev && dt > 0) {
        var ddx = lp.x - this._ptrPrev.x, ddz = lp.z - this._ptrPrev.z;
        var pv = Math.sqrt(ddx * ddx + ddz * ddz) / dt;
        var slowTgt = pv < 1.1 ? 1 : 0;
        this._ptrSlow = this._ptrSlow + (slowTgt - this._ptrSlow) * Math.min(1, dt * 4);
      }
      if (!this._ptrPrev) this._ptrPrev = { x: lp.x, z: lp.z };
      this._ptrPrev.x = lp.x; this._ptrPrev.z = lp.z;
      this._pointerLocal = lp;
    } else {
      this._pointerLocal = null;
      this._ptrSlow = 0;
    }
  } else {
    this._pointerLocal = null;
    this._ptrSlow = 0;
  }

  for (var i = 0; i < this._rigs.length; i++) {
    this._rigs[i].step(dt, this._time, this);
  }
};

/* ---------------- export ---------------- */
ROOT.AnacondaWalk = AnacondaWalk;
ROOT.AnacondaRig = AnacondaRig;
/* static helpers (tests / debugging) */
AnacondaWalk.radiusAt = radiusAt;
AnacondaWalk.GAITS = GAITS;

/* ---------------- auto-boot (browsers only) ---------------- */
if (typeof document === 'undefined') return;

function whenReady(fn) {

    } catch (e) {
      /* failed init (e.g. no WebGL) must not permanently block a retry */
      ROOT.__anacondaBooted = false;

    }

  boot();
} else {
  loadThree('https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js', boot, function () {
    loadThree('https://cdn.jsdelivr.net/npm/three@0.128.0/build/three.min.js', boot, function () {
      loadThree('https://unpkg.com/three@0.128.0/build/three.min.js', boot, function () {
        if (window.console) console.warn('[AnacondaWalk] could not load three.js — check your connection.');
      });

})();
