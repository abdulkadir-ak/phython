var SEG = 0.10;

  [0.32, 0.352], [0.44, 0.348], [0.58, 0.318], [0.70, 0.272],

 * C1-continuous, so there are no slope breaks between the knots - no
 * visible "steps" in body width along the spine. */

  m.push(d[n - 2]);

    var aa = m[i] / d[i], bb = m[i + 1] / d[i], ss = aa * aa + bb * bb;

    }

})();

    if (t <= PROFILE[i][0]) {
      var a = PROFILE[i - 1], b = PROFILE[i];
      var h = b[0] - a[0];

for (var _ri = 0; _ri < N; _ri++) RAD.push(radiusAt(_ri / (N - 1)));

/* radius slope per unit arc length (static) - tilts the tube normals on the

var RSLOPE = [];

/* ring direction tables (filled per quality tier by the manager) */
var RADIAL = 18;
var COSR = [], SINR = [];

/* ---------------- procedural anaconda skin ----------------
 * One scale-plate pass draws into three canvases at once:
 *   colour map (2048x512, u = along the body, v = around it),
 *   normal map (from a height map, Sobel filtered),
 *   roughness map (scale cells glossy, grooves dull).

 * dome whose peak is randomly offset (each scale tilted its own way), a
 * dark boundary groove between plates, a bright rostral rim where a scale
 * emerges from under its neighbour, and a per-scale tint in the colour
 * and roughness maps. All detail lives in texture space, so it follows
 * the deforming tube exactly and can never swim during movement.
 * v4.2.1 markings: the large-scale pattern (dorsal blotch chain, flank
 * spot rows, ocelli rows) is laid down by drifting irregular walks driven
 * by the value-noise helpers below - no even grids, no repeated stamps. */

/* v4.2.1 skin realism helpers: smooth 1D value noise - a random lattice
 * smoothed with a smoothstep ramp, stacked in a few octaves (fbm). Gives
 * every marking property a slow, organic wander along the body (u) with
 * no fixed period: neighbouring markings stay correlated (one animal, one
 * coherent pattern) while the chain never settles into an even grid. The
 * lattices are re-rolled on every texture build, so each animal wears a
 * different but self-consistent pattern. */

  var lat = [], i;
  for (i = 0; i <= cells; i++) lat.push(Math.random() * 2 - 1);
  return function (t) {
    var xx = clamp(t, 0, 1) * cells;
    var i0 = Math.floor(xx), f = xx - i0;
    var j1 = i0 + 1 > cells ? cells : i0 + 1;
    var u = f * f * (3 - 2 * f);
    return lat[i0] + (lat[j1] - lat[i0]) * u;

  var fs = [], i, amp = 1, tot = 0;

    var v = 0, a = 1, k;

function scaleRectPath(gc, cx, cy, w, h) {
  var r2 = Math.min(w, h) * 0.42;
  gc.beginPath();
  gc.moveTo(cx - w * 0.5 + r2, cy - h * 0.5);
  gc.arcTo(cx + w * 0.5, cy - h * 0.5, cx + w * 0.5, cy + h * 0.5, r2);
  gc.arcTo(cx + w * 0.5, cy + h * 0.5, cx - w * 0.5, cy + h * 0.5, r2);
  gc.arcTo(cx - w * 0.5, cy + h * 0.5, cx - w * 0.5, cy - h * 0.5, r2);
  gc.arcTo(cx - w * 0.5, cy - h * 0.5, cx + w * 0.5, cy - h * 0.5, r2);

function paintScaleGrid(gCol, gHgt, gSpc, W, H, rows) {

  var cols = Math.round(W / cell);
  var r, c, sx, sy;
  for (r = 0; r < rows; r++) {
    sy = (r + 0.5) * cell;
    for (c = 0; c < cols; c++) {
      sx = (c + (r % 2 ? 0.5 : 0)) * cell;   /* staggered diagonal rows     */

      var pw = cell * rnd(0.94, 1.05);
      var ph = cell * rnd(0.86, 1.00);
      var hgt = rnd(0.55, 1.0);
      var px = sx + rnd(-0.16, 0.16) * cell;
      var py = sy + rnd(-0.16, 0.16) * cell;

        gHgt.save();
        scaleRectPath(gHgt, sx, sy, pw, ph);
        gHgt.clip();

        hg.addColorStop(0, 'rgba(255,255,255,' + (0.36 * hgt).toFixed(3) + ')');
        hg.addColorStop(0.72, 'rgba(255,255,255,' + (0.11 * hgt).toFixed(3) + ')');
        hg.addColorStop(1, 'rgba(255,255,255,0)');

        gHgt.fillRect(sx - cell, sy - cell, cell * 3, cell * 3);
        gHgt.restore();
        /* dark boundary groove around each plate */
        scaleRectPath(gHgt, sx, sy, pw, ph);
        gHgt.strokeStyle = 'rgba(0,0,0,0.35)';
        gHgt.lineWidth = Math.max(1, cell * 0.11);
        gHgt.stroke();
        /* bright rostral rim: the free edge catching the light */
        gHgt.strokeStyle = 'rgba(255,255,255,' + (0.22 * hgt).toFixed(3) + ')';
        gHgt.lineWidth = Math.max(1, cell * 0.07);
        gHgt.beginPath();
        gHgt.moveTo(sx - pw * 0.40, sy - ph * 0.34);
        gHgt.lineTo(sx - pw * 0.40, sy + ph * 0.34);
        gHgt.stroke();
      }
      /* colour: per-scale tint (some scales lighter, some darker) plus the
       * fine dark boundary and a subtle highlight arc above the plate */
      if (gCol) {
        gCol.save();
        scaleRectPath(gCol, sx, sy, pw, ph);
        gCol.clip();
        gCol.fillStyle = Math.random() < 0.5
          ? 'rgba(214,222,184,' + rnd(0.015, 0.055).toFixed(3) + ')'
          : 'rgba(8,10,5,' + rnd(0.02, 0.06).toFixed(3) + ')';
        gCol.fillRect(sx - cell, sy - cell, cell * 3, cell * 3);
        gCol.restore();
        scaleRectPath(gCol, sx, sy, pw, ph);
        gCol.strokeStyle = 'rgba(8,10,5,' + rnd(0.06, 0.16).toFixed(3) + ')';
        gCol.lineWidth = Math.max(1, cell * 0.10);
        gCol.stroke();
        gCol.beginPath();
        gCol.arc(sx, sy - cell * 0.16, cell * 0.42, Math.PI * 1.12, Math.PI * 1.88);
        gCol.strokeStyle = 'rgba(210,220,180,' + rnd(0.02, 0.06).toFixed(3) + ')';
        gCol.lineWidth = Math.max(1, cell * 0.08);
        gCol.stroke();
      }
      /* roughness: per-scale gloss variation, plate cells bright (glossy) */
      if (gSpc) {
        gSpc.save();
        scaleRectPath(gSpc, sx, sy, pw, ph);
        gSpc.clip();
        gSpc.fillStyle = 'rgba(255,255,255,' + rnd(0.10, 0.24).toFixed(3) + ')';
        gSpc.fillRect(sx - cell, sy - cell, cell * 3, cell * 3);
        gSpc.restore();
      }
    }
  }
  /* groove lines between rows (height + roughness) */
  for (r = 0; r <= rows; r++) {
    sy = r * cell;
    if (gHgt) { gHgt.fillStyle = 'rgba(0,0,0,0.28)'; gHgt.fillRect(0, sy - cell * 0.10, W, cell * 0.20); }
    if (gSpc) { gSpc.fillStyle = 'rgba(0,0,0,0.34)'; gSpc.fillRect(0, sy - cell * 0.07, W, cell * 0.14); }
  }

  grd.addColorStop(0.16, PAL.flankB); grd.addColorStop(0.26, PAL.flankA);
  grd.addColorStop(0.36, PAL.backA);  grd.addColorStop(0.50, PAL.backA);
  grd.addColorStop(0.64, PAL.backA);  grd.addColorStop(0.74, PAL.flankA);
  grd.addColorStop(0.84, PAL.flankB); grd.addColorStop(0.93, PAL.bellyA);
  grd.addColorStop(1.00, PAL.bellyA);

    r = rnd(20, 90) * px;
    var mg = g.createRadialGradient(x, y, 1, x, y, r);
    mg.addColorStop(0, 'rgba(22,26,15,' + rnd(0.10, 0.30).toFixed(2) + ')');
    mg.addColorStop(1, 'rgba(22,26,15,0)');

   * tone and lateral position drift slowly along the body; every blotch is
   * fused from overlapping lobes with a variable pale rim, and 0-2 smaller
   * satellites step down the flanks on alternating sides. The chain stays

   * none sit on an even grid. */
  var bx = W * 0.015, side = Math.random() < 0.5 ? 1 : -1;

    var step = (W / 26) * (0.5 + 1.05 * gN) * rnd(0.82, 1.2);
    if (Math.random() < 0.08) step *= rnd(1.5, 2.05);   /* the odd wider gap */

    x = bx;
    y = H * 0.5 + driftLine(tB) * H * 0.042 + rnd(-9, 9) * px;
    rx = clamp(rnd(65, 150) * px * szD, 52 * px, 152 * px);

    rot = rnd(-0.22, 0.22);
    var aCore = clamp(0.76 + 0.2 * driftTone(tB) + rnd(-0.05, 0.05), 0.5, 0.95);
    var cR2 = 9 + Math.round(rnd(0, 6)), cG2 = 12 + Math.round(rnd(0, 6)), cB2 = 6 + Math.round(rnd(0, 4));
    var bg = g.createRadialGradient(x, y, ry * 0.2, x, y, rx);
    bg.addColorStop(0, 'rgba(' + cR2 + ',' + cG2 + ',' + cB2 + ',' + aCore.toFixed(2) + ')');
    bg.addColorStop(0.7, 'rgba(' + (cR2 + 2) + ',' + (cG2 + 3) + ',' + (cB2 + 2) + ',' + (aCore * 0.65).toFixed(2) + ')');
    bg.addColorStop(1, 'rgba(' + (cR2 + 2) + ',' + (cG2 + 3) + ',' + (cB2 + 2) + ',0)');
    g.fillStyle = bg;
    g.beginPath(); g.ellipse(x, y, rx, ry, rot, 0, TAU); g.fill();
    /* organic outline: 1-2 offset lobes fuse with the main body so each
     * blotch gets its own silhouette */
    var nLobe = Math.random() < 0.75 ? (Math.random() < 0.35 ? 2 : 1) : 0;
    var l;
    for (l = 0; l < nLobe; l++) {
      var lx = clamp(x + rnd(-0.75, 0.75) * rx, 6, W - 6);
      var ly = clamp(y + rnd(-0.5, 0.5) * ry, H * 0.34, H * 0.66);
      var lrx = rx * rnd(0.32, 0.58), lry = ry * rnd(0.38, 0.62);
      var lg2 = g.createRadialGradient(lx, ly, 1, lx, ly, lrx);
      lg2.addColorStop(0, 'rgba(' + cR2 + ',' + cG2 + ',' + cB2 + ',' + (aCore * 0.55).toFixed(2) + ')');
      lg2.addColorStop(1, 'rgba(' + cR2 + ',' + cG2 + ',' + cB2 + ',0)');
      g.fillStyle = lg2;
      g.beginPath(); g.ellipse(lx, ly, lrx, lry, rot + rnd(-0.35, 0.35), 0, TAU); g.fill();
    }
    /* pale rim: present on most blotches, variable strength and width,
     * fading with the blotch core so faint blotches get faint rims */
    if (Math.random() < 0.78) {
      g.strokeStyle = 'rgba(130,134,96,' + (rnd(0.10, 0.26) * clamp(0.3 + (aCore - 0.5) * 1.4, 0.3, 1)).toFixed(2) + ')';
      g.lineWidth = rnd(2, 5) * px;
      g.beginPath(); g.ellipse(x, y, rx * rnd(0.86, 0.95), ry * rnd(0.82, 0.94), rot, 0, TAU); g.stroke();
    }
    /* 0-2 smaller satellites stepping down the flanks, alternating sides -
     * the serrated join between the dorsal chain and the flank rows */
    var nSat = Math.random() < 0.62 ? (Math.random() < 0.3 ? 2 : 1) : 0;
    for (l = 0; l < nSat; l++) {
      side = -side;
      var sx2 = clamp(x + rnd(-0.4, 0.9) * rx, 6, W - 6);
      var sy2 = H * 0.5 + side * H * rnd(0.125, 0.175);
      var srx = rx * rnd(0.24, 0.4), sry = srx * rnd(0.5, 0.75);
      var sg = g.createRadialGradient(sx2, sy2, 1, sx2, sy2, srx);
      sg.addColorStop(0, 'rgba(' + cR2 + ',' + cG2 + ',' + cB2 + ',' + rnd(0.35, 0.6).toFixed(2) + ')');
      sg.addColorStop(1, 'rgba(' + cR2 + ',' + cG2 + ',' + cB2 + ',0)');
      g.fillStyle = sg;
      g.beginPath(); g.ellipse(sx2, sy2, srx, sry, rnd(-0.3, 0.3), 0, TAU); g.fill();
    }
    bx += Math.max(step, 10 * px);
  }

  /* round dark spots on the upper flanks: two independent irregular chains,
   * each with its own spacing / size / tone drift and a mean-reverting
   * lateral wander, so they follow the flank without ever lining up */
  for (i = 0; i < 2; i++) {
    var vy = i ? 0.665 : 0.335;
    var sx3 = W * rnd(0.004, 0.03);
    var sy3 = H * (vy + rnd(-0.012, 0.012));
    while (sx3 < W * 0.99) {
      var tS = sx3 / W;
      var tsS = tS * 0.5 + (i ? 0.5 : 0);   /* rows read different drift ranges */
      var gS2 = driftGap(tsS) * 0.5 + 0.5;
      var stepS = (W / 46) * (0.5 + 0.85 * gS2) * rnd(0.78, 1.3);
      if (Math.random() < 0.1) stepS *= rnd(1.4, 2.0);   /* natural gap in the row */
      var szS = 0.72 + 0.56 * (driftSize(tsS) * 0.5 + 0.5);
      var rS = clamp(rnd(9, 22) * px * szS, 6 * px, 26 * px);
      sy3 += (H * vy - sy3) * 0.22 + rnd(-1, 1) * H * 0.007;
      sy3 = clamp(sy3, H * (vy - 0.03), H * (vy + 0.03));
      g.fillStyle = 'rgba(18,21,12,' + clamp(0.47 + 0.2 * driftTone(tsS) + rnd(-0.08, 0.08), 0.25, 0.68).toFixed(2) + ')';
      g.beginPath();
      g.ellipse(sx3 + rnd(-5, 5) * px, sy3, rS, rS * rnd(0.65, 1), rnd(-0.3, 0.3), 0, TAU);
      g.fill();
      sx3 += Math.max(stepS, 6 * px);
    }
  }

  /* orange-yellow ocelli rows on the upper flanks (anaconda signature):
   * each row is its own irregular chain - spacing, size, tone, roundness
   * and lateral position all wander slowly along the body, the two rows
   * are independently phased, and the odd ocellus is missing or doubled.
   * The signature rows stay recognisable, but never grid-like. */
  for (i = 0; i < 2; i++) {
    var oy = i ? 0.705 : 0.295;
    var ox2 = W * rnd(0.004, 0.035);
    var oy2 = H * oy;
    while (ox2 < W * 0.99) {
      var tO = ox2 / W;
      var tsO = tO * 0.5 + (i ? 0.5 : 0.05);  /* rows read different drift ranges */
      var gO = driftGap(tsO) * 0.5 + 0.5;
      var stepO = (W / 46) * (0.48 + 0.95 * gO) * rnd(0.78, 1.28);
      if (Math.random() < 0.07) stepO *= rnd(1.5, 2.2);   /* natural gap */
      var szO = 0.72 + 0.56 * (driftSize(tsO) * 0.5 + 0.5);
      var rO = clamp(rnd(6, 12) * px * szO, 4.2 * px, 14.5 * px);
      oy2 += (H * oy - oy2) * 0.2 + rnd(-1, 1) * H * 0.006;
      oy2 = clamp(oy2, H * (oy - 0.026), H * (oy + 0.026));
      /* tone drifts between the deep and the bright palette orange */
      var toneO = clamp(0.5 + 0.5 * driftTone(tsO) + rnd(-0.08, 0.08), 0, 1);
      var aO = clamp(0.62 + 0.3 * toneO + rnd(-0.05, 0.05), 0.45, 0.96);
      var oR = Math.round(206 + 30 * toneO), oG = Math.round(128 + 34 * toneO), oB = Math.round(40 + 12 * toneO);
      x = ox2 + rnd(-5, 5) * px;
      y = oy2 + rnd(-5, 5) * px;
      var orx = rO * rnd(0.92, 1.18), ory = rO * rnd(0.84, 1.04);
      g.strokeStyle = 'rgba(14,17,9,' + clamp(0.58 + 0.18 * driftTone(tsO) + rnd(-0.08, 0.08), 0.3, 0.85).toFixed(2) + ')';
      g.lineWidth = rnd(1.4, 3) * px;
      g.fillStyle = 'rgba(' + oR + ',' + oG + ',' + oB + ',' + aO.toFixed(2) + ')';
      g.beginPath(); g.ellipse(x, y, orx, ory, rnd(-0.35, 0.35), 0, TAU); g.fill(); g.stroke();
      /* bright centre, slightly off-centre like the real eye-spot */
      g.fillStyle = 'rgba(240,178,72,' + rnd(0.68, 0.92).toFixed(2) + ')';
      g.beginPath(); g.arc(x - orx * rnd(0.05, 0.3), y - ory * rnd(0.05, 0.3), rO * rnd(0.38, 0.58), 0, TAU); g.fill();
      /* occasional second fleck beside the ocellus */
      if (Math.random() < 0.4) {
        g.fillStyle = 'rgba(217,154,53,' + rnd(0.35, 0.65).toFixed(2) + ')';
        g.beginPath(); g.arc(x + rnd(10, 24) * (Math.random() < 0.5 ? 1 : -1) * px, y + rnd(-8, 8) * px, rO * rnd(0.3, 0.5), 0, TAU); g.fill();
      }
      /* very occasionally a close twin ocellus, as on real chains */
      if (Math.random() < 0.06) {
        g.fillStyle = 'rgba(' + oR + ',' + oG + ',' + oB + ',' + (aO * 0.85).toFixed(2) + ')';
        g.beginPath(); g.arc(x + rO * 2.6, y + rnd(-6, 6) * px, rO * rnd(0.55, 0.8), 0, TAU); g.fill();
      }
      ox2 += Math.max(stepO, 9 * px);
    }
  }
  /* smaller orange flecks toward the back edge and lower flank */
  for (i = 0; i < 150 * px; i++) {
    x = Math.random() * W;
    var band = Math.random();
    y = (band < 0.3 ? rnd(0.36, 0.44) : band < 0.6 ? rnd(0.56, 0.64) : band < 0.8 ? rnd(0.06, 0.14) : rnd(0.86, 0.94)) * H;
    g.fillStyle = 'rgba(217,154,53,' + rnd(0.2, 0.55).toFixed(2) + ')';
    g.beginPath(); g.arc(x, y, rnd(2, 5) * px, 0, TAU); g.fill();
  }

  /* belly mottle near the seam (mostly hidden against the ground) */
  for (i = 0; i < 90 * px; i++) {
    x = Math.random() * W;
    y = (Math.random() < 0.5 ? rnd(0, 0.055) : rnd(0.945, 1)) * H;
    g.fillStyle = 'rgba(154,140,98,' + rnd(0.2, 0.5).toFixed(2) + ')';
    g.beginPath(); g.ellipse(x, y, rnd(6, 20) * px, rnd(4, 10) * px, 0, 0, TAU); g.fill();
  }

  /* fine speckle noise over everything */
  for (i = 0; i < 4200 * px; i++) {
    x = Math.random() * W; y = Math.random() * H;
    g.fillStyle = Math.random() < 0.5
      ? 'rgba(210,220,180,' + rnd(0.02, 0.07).toFixed(3) + ')'
      : 'rgba(10,12,6,' + rnd(0.03, 0.10).toFixed(3) + ')';
    g.fillRect(x, y, rnd(1.5, 4) * px, rnd(1.5, 4) * px);
  }

  /* subtle skin imperfections: a few scuffed / healed scales, dirt smudges
   * low on the flanks - breaks the too-clean procedural look */
  for (i = 0; i < 26 * px; i++) {
    x = Math.random() * W;
    y = (Math.random() < 0.7 ? rnd(0.24, 0.42) : rnd(0.58, 0.76)) * H;
    r = rnd(4, 11) * px;
    g.strokeStyle = 'rgba(96,92,66,' + rnd(0.10, 0.26).toFixed(2) + ')';
    g.lineWidth = Math.max(1, r * 0.35);
    g.beginPath(); g.arc(x, y, r, rnd(0, TAU), rnd(0, TAU) + rnd(1.2, 2.6)); g.stroke();
    if (Math.random() < 0.5) {
      g.fillStyle = 'rgba(120,110,74,' + rnd(0.05, 0.14).toFixed(2) + ')';
      g.beginPath(); g.ellipse(x + r * 0.4, y + r * 0.2, r * 0.8, r * 0.45, rnd(-0.4, 0.4), 0, TAU); g.fill();
    }
  }

  /* scale grid into all three canvases (rows tie out at the seam) */
  paintScaleGrid(g, gH, gS, W, H, rows);

  /* head-end shading so the tube blends into the lofted skull's occiput */
  var hFade = g.createLinearGradient(0, 0, 260, 0);
  hFade.addColorStop(0, 'rgba(20,22,14,0.34)'); hFade.addColorStop(1, 'rgba(20,22,14,0)');
  g.fillStyle = hFade; g.fillRect(0, 0, 260, H);

  var tex = new T.CanvasTexture(cCol);
  tex.wrapS = T.ClampToEdgeWrapping; tex.wrapT = T.RepeatWrapping;
  if (T.sRGBEncoding) { tex.encoding = T.sRGBEncoding; }
  return { map: tex, cHgt: cHgt, cSpc: cSpc };
}

/* full skin set: colour + Sobel normal + roughness.
 * MeshStandardMaterial has no specularMap, so the spec canvas is inverted
 * into a roughnessMap instead: bright scale cells -> low roughness (glossy),
 * dark grooves -> high roughness (matte). Gives the wet reptile sheen. */
function makeSkinTextures(T, mkCanvas, tier) {
  var s = makeSkinMaps(T, mkCanvas, tier);
  var nTex = makeNormalTexture(T, s.cHgt);
  var cR = mkCanvas(s.cSpc.width, s.cSpc.height);
  var gR = cR.getContext ? cR.getContext('2d') : null;
  if (gR) {
    gR.globalCompositeOperation = 'difference';
    gR.fillStyle = '#ffffff';
    gR.drawImage(s.cSpc, 0, 0);
    gR.globalCompositeOperation = 'source-over';
  }
  var rTex = new T.CanvasTexture(cR);
  rTex.wrapS = T.ClampToEdgeWrapping; rTex.wrapT = T.RepeatWrapping;
  return { map: s.map, normalMap: nTex, roughnessMap: rTex };
}

/* Sobel the height canvas into a tangent-space normal map.
 * str (optional) scales the relief: 1.5 body default, lower for the
 * subtler plating on the skull. */
function makeNormalTexture(T, cHgt, str) {
  var W = cHgt.width, H = cHgt.height;
  var tex = new T.CanvasTexture(cHgt);
  tex.wrapS = T.ClampToEdgeWrapping; tex.wrapT = T.RepeatWrapping;
  var gH = typeof cHgt.getContext === 'function' ? cHgt.getContext('2d') : null;
  if (!gH) return tex;
  str = str || 1.5;
  var src = gH.getImageData(0, 0, W, H).data;
  var out = gH.createImageData(W, H);
  var d = out.data;
  var x, y;
  for (y = 0; y < H; y++) {
    for (x = 0; x < W; x++) {
      var xp = (x + 1) % W, xm = (x - 1 + W) % W;
      var yp = (y + 1) % H, ym = (y - 1 + H) % H;
      var dx = src[(y * W + xp) * 4] - src[(y * W + xm) * 4];
      var dy = src[(yp * W + x) * 4] - src[(ym * W + x) * 4];
      var nx = -dx * str, ny = dy * str, nz = 255;
      var L = Math.sqrt(nx * nx + ny * ny + nz * nz);
      var o = (y * W + x) * 4;
      d[o] = (nx / L * 0.5 + 0.5) * 255;
      d[o + 1] = (ny / L * 0.5 + 0.5) * 255;
      d[o + 2] = (nz / L * 0.5 + 0.5) * 255;
      d[o + 3] = 255;
    }
  }
  gH.putImageData(out, 0, 0);
  return tex;
}

/* fine raised scales for the head and jaw: small plates at low relief
 * (the skull's scales are much smaller and flatter than the body's).
 * Shares scaleRectPath with the body pass, so both surfaces wear the
 * same plate pattern at different densities. */
function makeHeadNormalTexture(T, mkCanvas) {
  var S = 512;
  var c = mkCanvas(S, S), tex = new T.CanvasTexture(c);
  tex.wrapS = T.ClampToEdgeWrapping; tex.wrapT = T.RepeatWrapping;
  var g = c.getContext ? c.getContext('2d') : null;
  if (!g) return tex;
  var rows = 64, cell = S / rows, cols = Math.round(S / cell);
  var r, cc, sx, sy;
  g.fillStyle = '#808080'; g.fillRect(0, 0, S, S);
  for (r = 0; r < rows; r++) {
    sy = (r + 0.5) * cell;
    for (cc = 0; cc < cols; cc++) {
      sx = (cc + (r % 2 ? 0.5 : 0)) * cell;
      var hgt = rnd(0.40, 0.80);
      g.save();
      scaleRectPath(g, sx, sy, cell * rnd(0.94, 1.04), cell * rnd(0.86, 1.00));
      g.clip();
      var hg = g.createRadialGradient(
        sx + rnd(-0.15, 0.15) * cell, sy + rnd(-0.15, 0.15) * cell, cell * 0.05,
        sx, sy, cell * 0.75);
      hg.addColorStop(0, 'rgba(255,255,255,' + (0.30 * hgt).toFixed(3) + ')');
      hg.addColorStop(1, 'rgba(255,255,255,0)');
      g.fillStyle = hg;
      g.fillRect(sx - cell, sy - cell, cell * 3, cell * 3);
      g.restore();
      scaleRectPath(g, sx, sy, cell, cell * 0.96);
      g.strokeStyle = 'rgba(0,0,0,0.30)';
      g.lineWidth = Math.max(1, cell * 0.10);
      g.stroke();
    }
  }
  return makeNormalTexture(T, c, 1.1);
}

/* ---------------- eye iris texture ----------------
 * bright orange boa iris: blazing equator band (the part that shows around
 * the pupil), darker amber poles, fine dark flecks like the real thing */
function makeEyeTexture(T, mkCanvas) {
  var W = 256, H = 128;
  var c = mkCanvas(W, H), tex = new T.CanvasTexture(c);
  var g = c.getContext ? c.getContext('2d') : null;
  if (!g) return tex;
  var i;
  var band = g.createLinearGradient(0, 0, 0, H);
  band.addColorStop(0, '#6b3206');
  band.addColorStop(0.26, '#e05e08');
  band.addColorStop(0.44, '#ff8a1a');
  band.addColorStop(0.56, '#ff9a20');
  band.addColorStop(0.74, '#e05e08');
  band.addColorStop(1, '#6b3206');
  g.fillStyle = band; g.fillRect(0, 0, W, H);
  /* dark iris flecks / radial streaks */
  for (i = 0; i < 90; i++) {
    var ex = Math.random() * W, ey = Math.random() * H;
    g.strokeStyle = 'rgba(90,38,4,' + rnd(0.15, 0.4).toFixed(2) + ')';
    g.lineWidth = rnd(1, 2.2);
    g.beginPath(); g.moveTo(ex, ey); g.lineTo(ex + rnd(-3, 3), ey + rnd(4, 12)); g.stroke();
  }
  for (i = 0; i < 60; i++) {
    g.fillStyle = 'rgba(255,190,90,' + rnd(0.1, 0.3).toFixed(2) + ')';
    g.fillRect(Math.random() * W, Math.random() * H, rnd(1, 3), rnd(1, 2.5));
  }
  tex.wrapS = tex.wrapT = T.ClampToEdgeWrapping;
  if (T.sRGBEncoding) tex.encoding = T.sRGBEncoding;
  return tex;
}

/* ---------------- head texture ----------------
 * Painted for the lofted skull mesh. UV layout mirrors the body tube:
 * u = 0 at the snout tip -> 1 at the occiput (where it meets the neck),
 * v = 0.5 the dorsal midline, v = 0/1 the gape seam along the jaw line. */
function makeHeadTexture(T, mkCanvas) {
  var S = 512;
  var c = mkCanvas(S, S), tex = new T.CanvasTexture(c);
  var g = c.getContext ? c.getContext('2d') : null;
  if (!g) return tex;
  var i, x, y, r;
  g.fillStyle = PAL.headBase; g.fillRect(0, 0, S, S);

  /* dark olive blotches along the dorsal band (v 0.40-0.60) */
  for (i = 0; i < 46; i++) {
    x = Math.random() * S;
    y = S * (0.5 + rnd(-0.09, 0.09));
    r = rnd(12, 40);
    var bg = g.createRadialGradient(x, y, 1, x, y, r);
    bg.addColorStop(0, 'rgba(16,19,11,' + rnd(0.22, 0.5).toFixed(2) + ')');
    bg.addColorStop(1, 'rgba(16,19,11,0)');
    g.fillStyle = bg; g.beginPath(); g.ellipse(x, y, r, r * 0.72, 0, 0, TAU); g.fill();
  }

  /* pale grey-olive snout shield on top of the rostrum (u 0.03-0.34),
   * kept elongated, forward and MUTED - a bright pale crown reads as a
   * second face / inverted jaw from above */
  var pgrad = g.createRadialGradient(S * 0.17, S * 0.5, 2, S * 0.17, S * 0.5, S * 0.16);
  pgrad.addColorStop(0, 'rgba(174,171,142,0.42)');
  pgrad.addColorStop(0.55, 'rgba(162,159,130,0.26)');
  pgrad.addColorStop(1, 'rgba(152,149,120,0)');
  g.fillStyle = pgrad;
  g.beginPath(); g.ellipse(S * 0.17, S * 0.5, S * 0.155, S * 0.058, 0, 0, TAU); g.fill();

  /* shield sutures: dark midline seam + chevron cross-seams */
  g.strokeStyle = 'rgba(24,22,14,0.72)'; g.lineWidth = 3.4;
  g.beginPath();
  for (i = 0; i <= 24; i++) {
    var sx = S * (0.03 + i / 24 * 0.31);
    var sy = S * 0.5 + Math.sin(i * 0.9) * 2.5;
    if (i === 0) g.moveTo(sx, sy); else g.lineTo(sx, sy);
  }
  g.stroke();
  g.lineWidth = 2.2; g.strokeStyle = 'rgba(24,22,14,0.5)';
  for (i = 0; i < 4; i++) {
    var cx2 = S * (0.055 + i * 0.075);
    g.beginPath();
    g.moveTo(cx2, S * 0.5 - S * 0.062);
    g.quadraticCurveTo(cx2 + S * 0.020, S * 0.5, cx2, S * 0.5 + S * 0.062);
    g.stroke();
  }
  /* mottling inside the shield */
  for (i = 0; i < 22; i++) {
    var mr = rnd(3, 8);
    g.fillStyle = 'rgba(58,58,40,' + rnd(0.14, 0.28).toFixed(2) + ')';
    g.beginPath();
    g.ellipse(S * rnd(0.05, 0.31), S * rnd(0.44, 0.56), mr, mr * rnd(0.5, 0.8), 0, 0, TAU);
    g.fill();
  }

  /* small pale parietal patch at the back of the crown (u 0.60-0.82) */
  var pq = g.createRadialGradient(S * 0.71, S * 0.5, 2, S * 0.71, S * 0.5, S * 0.10);
  pq.addColorStop(0, 'rgba(174,171,142,0.18)');
  pq.addColorStop(1, 'rgba(152,149,120,0)');
  g.fillStyle = pq;
  g.beginPath(); g.ellipse(S * 0.71, S * 0.5, S * 0.10, S * 0.045, 0, 0, TAU); g.fill();
  g.strokeStyle = 'rgba(24,22,14,0.4)'; g.lineWidth = 2.4;
  g.beginPath();
  for (i = 0; i <= 14; i++) {
    var bx = S * (0.62 + i / 14 * 0.18);
    var by = S * 0.5 + Math.sin(i * 1.1) * 2;
    if (i === 0) g.moveTo(bx, by); else g.lineTo(bx, by);
  }
  g.stroke();

  /* very subdued orange occipital hint where the head meets the neck -
   * soft and feathered: a hard-edged slab reads as a growth on the crown */
  var band = g.createRadialGradient(S * 0.86, S * 0.5, 2, S * 0.86, S * 0.5, S * 0.11);
  band.addColorStop(0, 'rgba(217,154,53,0.14)');
  band.addColorStop(0.6, 'rgba(232,168,64,0.10)');
  band.addColorStop(1, 'rgba(217,154,53,0)');
  g.fillStyle = band;
  g.beginPath(); g.ellipse(S * 0.86, S * 0.5, S * 0.085, S * 0.13, 0, 0, TAU); g.fill();

  /* faint painted postocular stripe behind each eye (also built in geometry) */
  for (i = 0; i < 2; i++) {
    var py = i ? S * 0.66 : S * 0.34;
    var pst = g.createRadialGradient(S * 0.52, py, 1, S * 0.52, py, S * 0.11);
    pst.addColorStop(0, 'rgba(12,14,9,0.5)');
    pst.addColorStop(1, 'rgba(12,14,9,0)');
    g.fillStyle = pst;
    g.beginPath(); g.ellipse(S * 0.52, py, S * 0.075, S * 0.11, 0, 0, TAU); g.fill();
  }

  /* dark bridle line from each eye up-forward to the nostril - a strong
   * top/bottom cue that keeps the face reading right-side-up head-on */
  for (i = 0; i < 2; i++) {
    var y0 = i ? S * 0.66 : S * 0.34;
    var y1 = i ? S * 0.565 : S * 0.435;
    var brd = g.createLinearGradient(S * 0.48, y0, S * 0.14, y1);
    brd.addColorStop(0, 'rgba(16,18,10,0.45)');
    brd.addColorStop(1, 'rgba(16,18,10,0.25)');
    g.strokeStyle = brd; g.lineWidth = 3.0; g.lineCap = 'round';
    g.beginPath();
    g.moveTo(S * 0.48, y0);
    g.quadraticCurveTo(S * 0.28, (y0 + y1) * 0.5 - S * 0.028, S * 0.14, y1);
    g.stroke();
  }
  g.lineCap = 'butt';

  /* pale cream upper lip brightening toward the gape seam, both sides */
  for (i = 0; i < 2; i++) {
    var lg = i
      ? g.createLinearGradient(0, S * 0.72, 0, S)
      : g.createLinearGradient(0, S * 0.28, 0, 0);
    lg.addColorStop(0, 'rgba(226,216,180,0)');
    lg.addColorStop(0.55, 'rgba(226,216,180,0.30)');
    lg.addColorStop(1, 'rgba(236,228,196,0.55)');
    g.fillStyle = lg;
    g.fillRect(0, i ? S * 0.72 : 0, S, S * 0.28);
  }

  /* big blocky labial scales along both jaw lines, brightest at the snout */
  var NB = 30, bw = S / NB;
  for (i = 0; i < NB; i++) {
    var bcx = (i + 0.5) / NB * S;
    var d = Math.abs(bcx - 0.10 * S);
    var glow = Math.exp(-(d * d) / (2 * (S * 0.16) * (S * 0.16)));
    var a = 0.16 + 0.5 * glow;
    for (var row = 0; row < 2; row++) {
      var ry = row ? S * 0.855 : S * 0.145;
      g.fillStyle = 'rgba(238,230,198,' + a.toFixed(2) + ')';
      g.beginPath();
      if (g.roundRect) {
        g.roundRect(bcx - bw * 0.40, ry + Math.sin(i * 2.3) * 2, bw * 0.80, S * 0.105, 4);
      } else {
        g.rect(bcx - bw * 0.40, ry + Math.sin(i * 2.3) * 2, bw * 0.80, S * 0.105);
      }
      g.fill();
      g.strokeStyle = 'rgba(22,20,12,0.5)'; g.lineWidth = 2; g.stroke();
    }
  }
  /* seam between the two labial rows on each side */
  g.strokeStyle = 'rgba(22,20,12,0.32)'; g.lineWidth = 1.6;
  g.beginPath(); g.moveTo(0, S * 0.078); g.lineTo(S, S * 0.078); g.stroke();
  g.beginPath(); g.moveTo(0, S * 0.922); g.lineTo(S, S * 0.922); g.stroke();

  /* dark mouth seam along the gape line (v 0.055 / 0.945) */
  g.strokeStyle = 'rgba(9,11,7,0.6)'; g.lineWidth = 3;
  for (i = 0; i < 2; i++) {
    var my0 = i ? S * 0.945 : S * 0.055;
    g.beginPath();
    for (var k2 = 0; k2 <= S; k2 += 8) {
      var myy = my0 + Math.sin(k2 * 0.11) * 2.2;
      if (k2 === 0) g.moveTo(k2, myy); else g.lineTo(k2, myy);
    }
    g.stroke();
  }

  /* pink rostral flush + heat-pit dots at the snout tip (u < 0.05) */
  var rosy = g.createRadialGradient(S * 0.025, S * 0.5, 2, S * 0.025, S * 0.5, S * 0.09);
  rosy.addColorStop(0, 'rgba(206,116,94,0.40)');
  rosy.addColorStop(1, 'rgba(206,116,94,0)');
  g.fillStyle = rosy;
  g.beginPath(); g.ellipse(S * 0.025, S * 0.5, S * 0.055, S * 0.09, 0, 0, TAU); g.fill();
  g.fillStyle = 'rgba(186,62,44,0.55)';
  for (i = -2; i <= 2; i++) {
    g.beginPath();
    g.arc(S * 0.028, S * 0.5 + i * S * 0.017, 1.9, 0, TAU); g.fill();
  }

  /* occiput blend: the rear of the loft dives under the body texture */
  var hFade = g.createLinearGradient(S * 0.86, 0, S, 0);
  hFade.addColorStop(0, 'rgba(20,22,14,0)');
  hFade.addColorStop(1, 'rgba(20,22,14,0.4)');
  g.fillStyle = hFade; g.fillRect(S * 0.86, 0, S * 0.14, S);

  /* fine reticulation + light speckles */
  for (i = 0; i < 240; i++) {
    x = Math.random() * S; y = Math.random() * S;
    g.strokeStyle = 'rgba(12,14,8,' + rnd(0.08, 0.2).toFixed(3) + ')';
    g.lineWidth = rnd(1, 2.4);
    g.beginPath();
    g.arc(x, y, rnd(4, 12), Math.random() * TAU, Math.random() * TAU + 1.6);
    g.stroke();
  }
  for (i = 0; i < 480; i++) {
    g.fillStyle = 'rgba(220,226,190,' + rnd(0.02, 0.08).toFixed(3) + ')';
    g.fillRect(Math.random() * S, Math.random() * S, rnd(1.5, 3.5), rnd(1.5, 3.5));
  }
  tex.wrapS = tex.wrapT = T.ClampToEdgeWrapping;
  if (T.sRGBEncoding) tex.encoding = T.sRGBEncoding;
  return tex;
}

/* simple procedural sky/ground environment for the wet gloss */
function makeEnvMap(T, mkCanvas) {
  var faces = [], i, c, g, k;
  for (i = 0; i < 6; i++) {
    c = mkCanvas(64, 64);
    g = c.getContext ? c.getContext('2d') : null;
    if (g) {
      if (i === 2) {            /* up: pale sky */
        g.fillStyle = '#d6dfdf'; g.fillRect(0, 0, 64, 64);
      } else if (i === 3) {     /* down: dark ground */
        g.fillStyle = '#17170f'; g.fillRect(0, 0, 64, 64);
      } else {                  /* sides: sky-to-ground gradient */
        var gr = g.createLinearGradient(0, 0, 0, 64);
        gr.addColorStop(0, '#c4cfcd'); gr.addColorStop(0.55, '#8f998a');
        gr.addColorStop(0.62, '#4a4c36'); gr.addColorStop(1, '#2c2d1e');
        g.fillStyle = gr; g.fillRect(0, 0, 64, 64);
        /* faint horizon glow so the sheen reads wet, not grey */
        for (k = 0; k < 5; k++) {
          g.fillStyle = 'rgba(255,250,230,0.05)';
          g.fillRect(0, 30 + k * 2, 64, 2);
        }
      }
    }
    faces.push(c);
  }
  var tex = new T.CubeTexture(faces);
  tex.needsUpdate = true;
  return tex;
}
